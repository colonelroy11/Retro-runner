<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Retro Runner - Arcade Edition</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #111416;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            user-select: none;
            touch-action: none;
        }

        #gameContainer {
            position: relative;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
            border: 2px solid #00d2d3;
            border-radius: 8px;
            overflow: hidden;
            width: 95vw;
            max-width: 800px;
            aspect-ratio: 2 / 1;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            background-color: #1e272e;
        }
    </style>
</head>
<body>

<div id="gameContainer">
    <canvas id="gameCanvas" width="800" height="400"></canvas>
</div>

<script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    // Game state tracking matrix
    let gameState = "MENU"; // "MENU", "PLAYING", "GAMEOVER"
    let selectedDifficulty = 1; 
    let score = 0;
    let gameSpeed = 5;
    let maxSpeedSetting = 15;
    let speedIncrementSetting = 0.001;

    const GROUND_Y = canvas.height - 60;
    const GRAVITY = 0.6;

    let scorePopups = [];
    let particles = [];
    let obstacles = [];
    let collectibles = [];
    let spawnTimer = 0;
    let collectibleSpawnTimer = 100;
    let minSpawnInterval = 70;
    let maxSpawnInterval = 160;

    let highScore = 0;
    let totalCoins = 0;

    // Safe session memory fallback variables
    try {
        if (typeof localStorage !== 'undefined' && localStorage !== null) {
            if (localStorage.getItem("runner_highscore")) highScore = parseFloat(localStorage.getItem("runner_highscore"));
            if (localStorage.getItem("runner_coinbank")) totalCoins = parseInt(localStorage.getItem("runner_coinbank"));
        }
    } catch (e) {}

    // Native synth audio generator
    let audioCtx = null;
    function initAudio() {
        if (!audioCtx) {
            try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {}
        }
    }

    function playSound(type) {
        if (!audioCtx) return;
        try {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            const now = audioCtx.currentTime;

            if (type === "JUMP") {
                osc.type = "triangle";
                osc.frequency.setValueAtTime(150, now);
                osc.frequency.exponentialRampToValueAtTime(400, now + 0.12);
                gainNode.gain.setValueAtTime(0.15, now);
                gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.12);
                osc.start(now); osc.stop(now + 0.12);
            } else if (type === "COIN") {
                osc.type = "sine";
                osc.frequency.setValueAtTime(587.33, now); 
                osc.frequency.setValueAtTime(880, now + 0.06);   
                gainNode.gain.setValueAtTime(0.12, now);
                gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
                osc.start(now); osc.stop(now + 0.2);
            } else if (type === "ITEM") {
                osc.type = "sine";
                osc.frequency.setValueAtTime(523.25, now); 
                osc.frequency.setValueAtTime(783.99, now + 0.08); 
                gainNode.gain.setValueAtTime(0.12, now);
                gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
                osc.start(now); osc.stop(now + 0.25);
            } else if (type === "HIT") {
                osc.type = "sawtooth";
                osc.frequency.setValueAtTime(100, now);
                osc.frequency.linearRampToValueAtTime(30, now + 0.35);
                gainNode.gain.setValueAtTime(0.25, now);
                gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.35);
                osc.start(now); osc.stop(now + 0.35);
            } else if (type === "SELECT") {
                osc.type = "square";
                osc.frequency.setValueAtTime(280, now);
                gainNode.gain.setValueAtTime(0.05, now);
                gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.05);
                osc.start(now); osc.stop(now + 0.05);
            }
        } catch(e) {}
    }

    // Player object configuration map
    const player = {
        x: 80,
        y: GROUND_Y - 50,
        width: 40,
        height: 50,
        velocityY: 0,
        jumpForce: -12.5,
        isGrounded: false,
        jumpCount: 0,
        maxJumps: 2,

        update() {
            this.velocityY += GRAVITY;
            this.y += this.velocityY;
            if (this.y + this.height >= GROUND_Y) {
                this.y = GROUND_Y - this.height;
                this.velocityY = 0;
                this.isGrounded = true;
                this.jumpCount = 0;
            } else {
                this.isGrounded = false;
            }
        },

        draw() {
            // Neon cyan vector hero box
            ctx.fillStyle = "#00d2d3";
            ctx.fillRect(this.x, this.y, this.width, this.height);
            ctx.strokeStyle = "#ffffff";
            ctx.lineWidth = 2;
            ctx.strokeRect(this.x, this.y, this.width, this.height);
        },

        reset() {
            this.y = GROUND_Y - this.height;
            this.velocityY = 0;
            this.isGrounded = true;
            this.jumpCount = 0;
        }
    };

    class Obstacle {
        constructor() {
            this.width = 25 + Math.random() * 20;
            this.height = 30 + Math.random() * 25;
            this.x = canvas.width + 20;
            this.y = GROUND_Y - this.height;
        }
        update() { this.x -= gameSpeed; }
        draw() {
            // High contrast neon crimson hazard box
            ctx.fillStyle = "#ff6b6b";
            ctx.fillRect(this.x, this.y, this.width, this.height);
            ctx.strokeStyle = "#ffffff";
            ctx.lineWidth = 1.5;
            ctx.strokeRect(this.x, this.y, this.width, this.height);
        }
    }

    class Collectible {
        constructor(type) {
            this.type = type;
            this.width = 24;
            this.height = 24;
            this.x = canvas.width + 20;
            this.y = GROUND_Y - this.height - (Math.random() > 0.5 ? 10 : 75);
        }
        update() { this.x -= gameSpeed; }
        draw() {
            ctx.fillStyle = this.type === "COIN" ? "#f1c40f" : "#9b59b6";
            ctx.beginPath();
            ctx.arc(this.x + 12, this.y + 12, 12, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = "#ffffff";
            ctx.lineWidth = 1;
            ctx.stroke();
        }
    }

    class Particle {
        constructor(x, y, color) {
            this.x = x; this.y = y; this.color = color;
            this.radius = 2 + Math.random() * 2;
            this.vx = (Math.random() - 0.5) * 5;
            this.vy = (Math.random() - 0.7) * 5;
            this.alpha = 1;
            this.decay = 0.02 + Math.random() * 0.02;
        }
        update() { this.x += this.vx; this.y += this.vy; this.vy += 0.08; this.alpha -= this.decay; }
        draw() {
            ctx.save(); ctx.globalAlpha = this.alpha; ctx.fillStyle = this.color;
            ctx.beginPath(); ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2); ctx.fill(); ctx.restore();
        }
    }

    function createParticleBurst(x, y, color) {
        for (let i = 0; i < 10; i++) particles.push(new Particle(x, y, color));
    }

    function manageEntities() {
        spawnTimer--;
        let dynamicInterval = maxSpawnInterval - ((gameSpeed / maxSpeedSetting) * (maxSpawnInterval - minSpawnInterval));
        if (spawnTimer <= 0) {
            obstacles.push(new Obstacle());
            spawnTimer = dynamicInterval + (Math.random() * 50);
        }

        for (let i = obstacles.length - 1; i >= 0; i--) {
            obstacles[i].update(); obstacles[i].draw();
            if (player.x < obstacles[i].x + obstacles[i].width && player.x + player.width > obstacles[i].x && player.y < obstacles[i].y + obstacles[i].height && player.y + player.height > obstacles[i].y) {
                gameState = "GAMEOVER";
                playSound("HIT");
                createParticleBurst(player.x + player.width / 2, player.y + player.height / 2, "#ff6b6b");
                if (score > highScore) { highScore = score; try { localStorage.setItem("runner_highscore", highScore); } catch(e){} }
            }
            if (obstacles[i].x + obstacles[i].width < 0) obstacles.splice(i, 1);
        }

        collectibleSpawnTimer--;
        if (collectibleSpawnTimer <= 0) {
            collectibles.push(new Collectible(Math.random() > 0.25 ? "COIN" : "ITEM"));
            collectibleSpawnTimer = 110 + Math.random() * 90;
        }

        for (let i = collectibles.length - 1; i >= 0; i--) {
            collectibles[i].update(); collectibles[i].draw();
            if (player.x < collectibles[i].x + collectibles[i].width && player.x + player.width > collectibles[i].x && player.y < collectibles[i].y + collectibles[i].height && player.y + player.height > collectibles[i].y) {
                let pts = collectibles[i].type === "COIN" ? 50 : 150;
                let col = collectibles[i].type === "COIN" ? "#f1c40f" : "#9b59b6";
                score += pts;
