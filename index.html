<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Arcade Loop</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }
        
        body {
            background-color: #111416;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #ffffff;
            font-family: Arial, sans-serif;
            overflow: hidden;
            user-select: none;
            touch-action: none;
        }

        #titleText {
            font-size: 24px;
            font-weight: bold;
            color: #00d2d3;
            margin-bottom: 20px;
            letter-spacing: 2px;
        }

        #gameContainer {
            position: relative;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
            border: 2px solid #00d2d3;
            border-radius: 8px;
            overflow: hidden;
            width: 90vw;
            height: 75vh;
            max-width: 400px; 
            max-height: 680px;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100% !important;
            height: 100% !important;
            display: block;
        }
    </style>
</head>
<body>

<!-- HTML HEADER: If you see this text, the cache is successfully broken -->
<div id="titleText">RETRO RUNNER ARCADE</div>

<div id="gameContainer">
    <canvas id="gameCanvas" width="400" height="700"></canvas>
</div>

<script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    canvas.width = 400;
    canvas.height = 700;

    let gameState = "MENU"; 
    let selectedDifficulty = 1; 
    let score = 0;
    let gameSpeed = 5;
    const GROUND_Y = 580;

    let obstacles = [];
    let collectibles = [];
    let spawnTimer = 0;

    function drawBackground() {
        ctx.fillStyle = "#1e272e"; 
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "#2c3e50"; 
        ctx.fillRect(0, GROUND_Y, canvas.width, canvas.height - GROUND_Y);
        ctx.fillStyle = "#00d2d3"; 
        ctx.fillRect(0, GROUND_Y, canvas.width, 4);
    }

    function drawMainMenuScreen() {
        ctx.fillStyle = "#1e2430"; 
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        ctx.fillStyle = "#00d2d3"; 
        ctx.font = "bold 28px sans-serif"; 
        ctx.textAlign = "center";
        ctx.fillText("SELECT DIFFICULTY", 200, 200);

        const diffs = ["EASY", "MEDIUM", "HARD"];
        for (let i = 0; i < diffs.length; i++) {
            let bY = 280 + (i * 80);
            if (i === selectedDifficulty) {
                ctx.fillStyle = "#00d2d3";
                ctx.fillRect(110, bY, 180, 50);
                ctx.fillStyle = "#111416";
            } else {
                ctx.fillStyle = "#2c3e50";
                ctx.fillRect(110, bY, 180, 50);
                ctx.fillStyle = "#ffffff";
            }
            ctx.font = "bold 16px sans-serif";
            ctx.fillText(diffs[i], 200, bY + 31);
        }
    }

    function handleInputGate(clientX, clientY) {
        const rect = canvas.getBoundingClientRect();
        const mX = (clientX - rect.left) * (canvas.width / rect.width);
        const mY = (clientY - rect.top) * (canvas.height / rect.height);

        if (gameState === "MENU") {
            for (let i = 0; i < 3; i++) {
                let bY = 280 + (i * 80);
                if (mX >= 110 && mX <= 290 && mY >= bY && mY <= bY + 50) {
                    selectedDifficulty = i;
                    gameSpeed = i === 0 ? 4 : (i === 1 ? 5.5 : 7.5);
                    obstacles = []; score = 0; spawnTimer = 0;
                    gameState = "PLAYING";
                    return;
                }
            }
        } else if (gameState === "PLAYING") {
            gameState = "GAMEOVER";
        } else {
            gameState = "MENU";
        }
    }

    canvas.addEventListener("pointerdown", function(e) {
        e.preventDefault();
        handleInputGate(e.clientX, e.clientY);
    });

    function gameLoop() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        if (gameState === "MENU") {
            drawMainMenuScreen();
        } else if (gameState === "PLAYING") {
            drawBackground();
            ctx.fillStyle = "#00d2d3";
            ctx.fillRect(60, GROUND_Y - 50, 40, 50);
            ctx.fillStyle = "#ffffff";
            ctx.font = "bold 16px sans-serif";
            ctx.textAlign = "left";
            ctx.fillText("PLAYING... TAP TO DIE", 30, 50);
        } else {
            ctx.fillStyle = "rgba(0,0,0,0.85)"; ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "#ff6b6b"; ctx.font = "bold 36px sans-serif"; ctx.textAlign = "center";
            ctx.fillText("GAME OVER", 200, 300);
            ctx.fillStyle = "#ffffff"; ctx.font = "14px sans-serif"; ctx.fillText("TAP SCREEN TO RESET", 200, 360);
        }
        requestAnimationFrame(gameLoop);
    }
    gameLoop();
</script>

</body>
</html>
