<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Retro Runner - Arcade Port</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }
        
        body {
            background-color: #111416;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #ffffff;
            font-family: Arial, sans-serif;
            overflow: hidden;
            user-select: none;
            touch-action: none;
        }

        #titleText {
            font-size: 24px;
            font-weight: bold;
            color: #00d2d3;
            margin-bottom: 20px;
            letter-spacing: 2px;
        }

        #gameContainer {
            position: relative;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
            border: 2px solid #00d2d3;
            border-radius: 8px;
            overflow: hidden;
            width: 90vw;
            height: 75vh;
            max-width: 400px; 
            max-height: 680px;
            background-color: #1a1a24;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100% !important;
            height: 100% !important;
            display: block;
        }
    </style>
</head>
<!-- THE BODY TRIGGER: Bypasses loading order crashes on phones -->
<body onload="bootGameEngine()">

<div id="titleText">RETRO RUNNER ARCADE</div>

<div id="gameContainer">
    <canvas id="gameCanvas" width="400" height="700"></canvas>
</div>

<script>
    function bootGameEngine() {
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        canvas.width = 400;
        canvas.height = 700;

        let gameState = "MENU"; 
        let selectedDifficulty = 1; 
        let score = 0;
        let gameSpeed = 5;
        let maxSpeedSetting = 15;
        let speedIncrementSetting = 0.001;

        const GROUND_Y = 580;
        const GRAVITY = 0.6;

        let obstacles = [];
        let collectibles = [];
        let scorePopups = [];
        let particles = [];
        let spawnTimer = 0;
        let collectibleSpawnTimer = 100;

        let highScore = 0;
        let totalCoins = 0;

        const player = {
            x: 60, y: GROUND_Y - 50, width: 40, height: 50, velocityY: 0, jumpForce: -13.5, isGrounded: false, jumpCount: 0, maxJumps: 2,
            update() {
                this.velocityY += GRAVITY; this.y += this.velocityY;
                if (this.y + this.height >= GROUND_Y) { this.y = GROUND_Y - this.height; this.velocityY = 0; this.isGrounded = true; this.jumpCount = 0; }
                else { this.isGrounded = false; }
            },
            draw() {
                ctx.fillStyle = "#00d2d3"; ctx.fillRect(this.x, this.y, this.width, this.height);
                ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 2; ctx.strokeRect(this.x, this.y, this.width, this.height);
            }
        };

        class Obstacle {
            constructor() { this.width = 30; this.height = 40; this.x = canvas.width + 20; this.y = GROUND_Y - this.height; }
            update() { this.x -= gameSpeed; }
            draw() {
                ctx.fillStyle = "#ff6b6b"; ctx.fillRect(this.x, this.y, this.width, this.height);
                ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 1.5; ctx.strokeRect(this.x, this.y, this.width, this.height);
            }
        }

        class Collectible {
            constructor() { this.width = 24; this.height = 24; this.x = canvas.width + 20; this.y = GROUND_Y - 70; }
            update() { this.x -= gameSpeed; }
            draw() {
                ctx.fillStyle = "#f1c40f"; ctx.beginPath(); ctx.arc(this.x + 12, this.y + 12, 12, 0, Math.PI * 2); ctx.fill();
                ctx.strokeStyle = "#ffffff"; ctx.stroke();
            }
        }

        function manageEntities() {
            spawnTimer--;
            if (spawnTimer <= 0) { obstacles.push(new Obstacle()); spawnTimer = 120 + Math.random() * 50; }
            for (let i = obstacles.length - 1; i >= 0; i--) {
                obstacles[i].update(); obstacles[i].draw();
                if (player.x < obstacles[i].x + obstacles[i].width && player.x + player.width > obstacles[i].x && player.y < obstacles[i].y + obstacles[i].height && player.y + player.height > obstacles[i].y) { gameState = "GAMEOVER"; }
                if (obstacles[i].x + obstacles[i].width < 0) obstacles.splice(i, 1);
            }
            collectibleSpawnTimer--;
            if (collectibleSpawnTimer <= 0) { collectibles.push(new Collectible()); collectibleSpawnTimer = 150; }
            for (let i = collectibles.length - 1; i >= 0; i--) {
                collectibles[i].update(); collectibles[i].draw();
                if (player.x < collectibles[i].x + collectibles[i].width && player.x + player.width > collectibles[i].x && player.y < collectibles[i].y + collectibles[i].height && player.y + player.height > collectibles[i].y) { score += 50; totalCoins++; collectibles.splice(i, 1); continue; }
                if (collectibles[i].x + collectibles[i].width < 0) collectibles.splice(i, 1);
            }
        }

        function drawBackground() {
            ctx.fillStyle = "#1e272e"; ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "#2c3e50"; ctx.fillRect(0, GROUND_Y, canvas.width, canvas.height - GROUND_Y);
            ctx.fillStyle = "#00d2d3"; ctx.fillRect(0, GROUND_Y, canvas.width, 4);
        }

        function drawMainMenuScreen() {
            ctx.fillStyle = "#1e2430"; ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "#00d2d3"; ctx.font = "bold 28px sans-serif"; ctx.textAlign = "center"; ctx.fillText("SELECT DIFFICULTY", canvas.width / 2, 200);
            const diffs = ["EASY", "MEDIUM", "HARD"];
            for (let i = 0; i < diffs.length; i++) {
                let bY = 280 + (i * 80); let bX = canvas.width / 2;
                if (i === selectedDifficulty) { ctx.fillStyle = "#00d2d3"; ctx.fillRect(bX - 90, bY, 180, 50); ctx.fillStyle = "#111416"; } 
                else { ctx.fillStyle = "#2c3e50"; ctx.fillRect(bX - 90, bY, 180, 50); ctx.fillStyle = "#ffffff"; }
                ctx.font = "bold 16px sans-serif"; ctx.fillText(diffs[i], bX, bY + 31);
            }
        }

        function handleInputGate(clientX, clientY) {
            const rect = canvas.getBoundingClientRect();
            const mX = (clientX - rect.left) * (canvas.width / rect.width);
            const mY = (clientY - rect.top) * (canvas.height / rect.height);
            if (gameState === "MENU") {
                for (let i = 0; i < 3; i++) {
                    let bY = 280 + (i * 80); let bX = canvas.width / 2;
                    if (mX >= bX - 90 && mX <= bX + 90 && mY >= bY && mY <= bY + 50) {
                        selectedDifficulty = i; gameSpeed = i === 0 ? 4 : (i === 1 ? 5.5 : 7.5);
                        obstacles = []; collectibles = []; score = 0; spawnTimer = 0; gameState = "PLAYING"; return;
                    }
                }
            } else if (gameState === "PLAYING") {
                if (player.isGrounded || player.jumpCount < player.maxJumps) { player.velocityY = player.jumpForce; player.jumpCount++; }
            } else { gameState = "MENU"; }
        }

        canvas.addEventListener("pointerdown", function(e) { e.preventDefault(); handleInputGate(e.clientX, e.clientY); });

        function gameLoop() {
            if (gameState === "MENU") { drawMainMenuScreen(); } 
            else if (gameState === "PLAYING") {
                drawBackground(); if (gameSpeed < maxSpeedSetting) gameSpeed += speedIncrementSetting;
                player.update(); score += 0.15; player.draw(); manageEntities();
                ctx.fillStyle = "#ffffff"; ctx.font = "bold 16px sans-serif"; ctx.textAlign = "left"; ctx.fillText("SCORE: " + Math.floor(score), 20, 40);
            } else {
                ctx.fillStyle = "rgba(0,0,0,0.85)"; ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = "#ff6b6b"; ctx.font = "bold 36px sans-serif"; ctx.textAlign = "center"; ctx.fillText("GAME OVER", canvas.width / 2, 300);
                ctx.fillStyle = "#ffffff"; ctx.font = "14px sans-serif"; ctx.fillText("TAP SCREEN TO RESET", canvas.width / 2, 360);
            }
            requestAnimationFrame(gameLoop);
        }
        gameLoop();
    }
</script>

</body>
</html>
