<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Retro Runner</title>
    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        
        body {
            margin: 0;
            padding: 0;
            background-color: #111416;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #ffffff;
            font-family: sans-serif;
            overflow: hidden;
            user-select: none;
            touch-action: none;
        }

        #gameContainer {
            position: relative;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
            border: 2px solid #00d2d3;
            border-radius: 8px;
            overflow: hidden;
            width: 92vw;
            height: 85vh;
            max-width: 420px; 
            max-height: 740px;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>

<div id="gameContainer">
    <canvas id="gameCanvas" width="400" height="700"></canvas>
</div>

<script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    // Force strict dimensions
    canvas.width = 400;
    canvas.height = 700;

    // Game State Matrix
    let gameState = "MENU"; 
    let selectedDifficulty = 1; 
    let score = 0;
    let gameSpeed = 5;
    let maxSpeedSetting = 15;
    let speedIncrementSetting = 0.001;

    const GROUND_Y = 580;
    const GRAVITY = 0.6;

    let obstacles = [];
    let collectibles = [];
    let scorePopups = [];
    let particles = [];
    let spawnTimer = 0;
    let collectibleSpawnTimer = 100;
    let minSpawnInterval = 70;
    let maxSpawnInterval = 160;

    let highScore = 0;
    let totalCoins = 0;

    // Player configurations
    const player = {
        x: 60,
        y: GROUND_Y - 50,
        width: 40,
        height: 50,
        velocityY: 0,
        jumpForce: -13.5,
        isGrounded: false,
        jumpCount: 0,
        maxJumps: 2,

        update() {
            this.velocityY += GRAVITY;
            this.y += this.velocityY;
            if (this.y + this.height >= GROUND_Y) {
                this.y = GROUND_Y - this.height;
                this.velocityY = 0;
                this.isGrounded = true;
                this.jumpCount = 0;
            } else {
                this.isGrounded = false;
            }
        },

        draw() {
            ctx.fillStyle = "#00d2d3";
            ctx.fillRect(this.x, this.y, this.width, this.height);
            ctx.strokeStyle = "#ffffff";
            ctx.lineWidth = 2;
            ctx.strokeRect(this.x, this.y, this.width, this.height);
        }
    };

    class Obstacle {
        constructor() {
            this.width = 30;
            this.height = 40;
            this.x = canvas.width + 20;
            this.y = GROUND_Y - this.height;
        }
        update() { this.x -= gameSpeed; }
        draw() {
            ctx.fillStyle = "#ff6b6b";
            ctx.fillRect(this.x, this.y, this.width, this.height);
            ctx.strokeStyle = "#ffffff";
            ctx.lineWidth = 1.5;
            ctx.strokeRect(this.x, this.y, this.width, this.height);
        }
    }

    class Collectible {
        constructor(type) {
            this.type = type;
            this.width = 24;
            this.height = 24;
            this.x = canvas.width + 20;
            this.y = GROUND_Y - 70;
        }
        update() { this.x -= gameSpeed; }
        draw() {
            ctx.fillStyle = this.type === "COIN" ? "#f1c40f" : "#9b59b6";
            ctx.beginPath();
            ctx.arc(this.x + 12, this.y + 12, 12, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = "#ffffff";
            ctx.lineWidth = 1;
            ctx.stroke();
        }
    }

    function manageEntities() {
        spawnTimer--;
        if (spawnTimer <= 0) {
            obstacles.push(new Obstacle());
            spawnTimer = 110 + Math.random() * 50;
        }

        for (let i = obstacles.length - 1; i >= 0; i--) {
            obstacles[i].update(); obstacles[i].draw();
            if (player.x < obstacles[i].x + obstacles[i].width && player.x + player.width > obstacles[i].x && player.y < obstacles[i].y + obstacles[i].height && player.y + player.height > obstacles[i].y) {
                gameState = "GAMEOVER";
                if (score > highScore) highScore = score;
            }
            if (obstacles[i].x + obstacles[i].width < 0) obstacles.splice(i, 1);
        }

        collectibleSpawnTimer--;
        if (collectibleSpawnTimer <= 0) {
            collectibles.push(new Collectible(Math.random() > 0.3 ? "COIN" : "ITEM"));
            collectibleSpawnTimer = 140;
        }

        for (let i = collectibles.length - 1; i >= 0; i--) {
            collectibles[i].update(); collectibles[i].draw();
            if (player.x < collectibles[i].x + collectibles[i].width && player.x + player.width > collectibles[i].x && player.y < collectibles[i].y + collectibles[i].height && player.y + player.height > collectibles[i].y) {
                if (collectibles[i].type === "COIN") totalCoins++;
                score += 50;
                collectibles.splice(i, 1);
                continue;
            }
            if (collectibles[i].x + collectibles[i].width < 0) collectibles.splice(i, 1);
        }
    }

    function drawBackground() {
        ctx.fillStyle = "#1e272e"; 
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        ctx.fillStyle = "#2c3e50"; 
        ctx.fillRect(0, GROUND_Y, canvas.width, canvas.height - GROUND_Y);
        
        ctx.fillStyle = "#00d2d3"; 
        ctx.fillRect(0, GROUND_Y, canvas.width, 4);
    }

    function drawMainMenuScreen() {
        // High-contrast distinct background color to confirm active rendering
        ctx.fillStyle = "#1c2430"; 
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        ctx.fillStyle = "#00d2d3"; 
        ctx.font = "bold 32px sans-serif"; 
        ctx.textAlign = "center";
        ctx.fillText("RETRO RUNNER", 200, 160);

        ctx.fillStyle = "#f1c40f"; 
        ctx.font = "16px sans-serif";
        ctx.fillText("Record: " + Math.floor(highScore), 200, 210);
        ctx.fillText("Coins: " + totalCoins, 200, 235);

        ctx.fillStyle = "#ffffff"; 
        ctx.font = "15px sans-serif";
        ctx.fillText("TAP A DIFFICULTY TO START", 200, 320);

        const diffs = ["EASY", "MEDIUM", "HARD"];
        for (let i = 0; i < diffs.length; i++) {
            let bY = 370 + (i * 70);
            
            if (i === selectedDifficulty) {
                ctx.fillStyle = "#00d2d3";
                ctx.fillRect(120, bY, 160, 45);
                ctx.fillStyle = "#111416";
            } else {
                ctx.fillStyle = "#2c3e50";
                ctx.fillRect(120, bY, 160, 45);
                ctx.fillStyle = "#ffffff";
            }
            ctx.font = "bold 15px sans-serif";
            ctx.fillText(diffs[i], 200, bY + 28);
        }
    }

    function drawGameOverScreen() {
        ctx.fillStyle = "rgba(0, 0, 0, 0.85)"; 
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        ctx.fillStyle = "#ff6b6b"; 
        ctx.font = "bold 38px sans-serif"; 
        ctx.textAlign = "center";
        ctx.fillText("GAME OVER", 200, 300);
        
        ctx.fillStyle = "#ffffff"; 
        ctx.font = "16px sans-serif";
        ctx.fillText("Score: " + Math.floor(score), 200, 350);
        ctx.fillText("Total Coins: " + totalCoins, 200, 375);
        
        ctx.fillStyle = "#a4b0be"; 
        ctx.font = "13px sans-serif";
        ctx.fillText("TAP ANYWHERE TO RETURN TO MENU", 200, 450);
    }

    function drawUI() {
        ctx.fillStyle = "#ffffff"; 
        ctx.font = "bold 16px sans-serif"; 
        ctx.textAlign = "left";
        ctx.fillText("SCORE: " + Math.floor(score), 20, 40);
        
        ctx.fillStyle = "#f1c40f"; 
        ctx.textAlign = "right"; 
        ctx.fillText("HI: " + Math.floor(highScore), 380, 40);
    }

    function handleInputGate(clientX, clientY) {
        const rect = canvas.getBoundingClientRect();
        const scaleX = canvas.width / rect.width;
        const scaleY = canvas.height / rect.height;
        
        const mX = (clientX - rect.left) * scaleX;
        const mY = (clientY - rect.top) * scaleY;

        if (gameState === "MENU") {
            for (let i = 0; i < 3; i++) {
                let bY = 370 + (i * 70);
                if (mX >= 120 && mX <= 280 && mY >= bY && mY <= bY + 45) {
                    selectedDifficulty = i;
                    if (i === 0) { gameSpeed = 4; maxSpeedSetting = 10; speedIncrementSetting = 0.0005; }
                    else if (i === 1) { gameSpeed = 5.5; maxSpeedSetting = 15; speedIncrementSetting = 0.001; }
                    else { gameSpeed = 7.5; maxSpeedSetting = 20; speedIncrementSetting = 0.002; }
                    
                    obstacles = []; collectibles = []; score = 0; spawnTimer = 0;
                    player.y = GROUND_Y - player.height; player.velocityY = 0; player.jumpCount = 0;
                    gameState = "PLAYING";
                    return;
                }
            }
        } else if (gameState === "PLAYING") {
            if (player.isGrounded || player.jumpCount < player.maxJumps) {
                player.velocityY = player.jumpForce;
                player.jumpCount++;
            }
        } else if (gameState === "GAMEOVER") {
            gameState = "MENU";
        }
    }

    // Unified pointer listener supporting all desktop and mobile inputs identically
    canvas.addEventListener("pointerdown", function(e) {
