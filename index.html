<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro Endless Runner with Savings Track</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            user-select: none;
        }

        #gameContainer {
            position: relative;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            border-radius: 8px;
            overflow: hidden;
        }

        canvas {
            background-color: #2c3e50;
            display: block;
        }
    </style>
</head>
<body>

<div id="gameContainer">
    <canvas id="gameCanvas" width="800" height="400"></canvas>
</div>

<script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    // Game state tracking
    let gameState = "PLAYING"; 
    let score = 0;
    let gameSpeed = 5;
    const MAX_SPEED = 15;
    const SPEED_INCREMENT = 0.001;

    // Environmental constants
    const GROUND_Y = canvas.height - 60;
    const GRAVITY = 0.6;

    // ===================================================
    // PERSISTENT LOCAL STORAGE (HIGH SCORE TRACKING)
    // ===================================================
    // Attempt to pull any previously saved records out of browser storage
    let highScore = localStorage.getItem("runner_highscore") ? parseFloat(localStorage.getItem("runner_highscore")) : 0;

    // ===================================================
    // IMAGE ASSET LOADING SYSTEM (LINK YOUR 4 GRAPHICS HERE)
    // ===================================================
    // To make these load, replace the names inside quotes with your exact filenames!
    
    const imgPlayerRun1 = new Image();
    imgPlayerRun1.src = "player_run1.png"; // Change to your first player image name

    const imgPlayerRun2 = new Image();
    imgPlayerRun2.src = "player_run2.png"; // Change to your second player image name (for running animation)

    const imgObstacle = new Image();
    imgObstacle.src = "obstacle.png";       // Change to your obstacle image name

    const imgBackground = new Image();
    imgBackground.src = "background.png";   // Change to your environment background image name

    // Helper logic to verify if your image assets successfully found their path
    let assetsLoaded = false;
    let loadedCount = 0;
    const totalAssets = 4;
    
    function onAssetLoad() {
        loadedCount++;
        if (loadedCount === totalAssets) {
            assetsLoaded = true;
        }
    }
    
    imgPlayerRun1.onload = onAssetLoad;
    imgPlayerRun2.onload = onAssetLoad;
    imgObstacle.onload = onAssetLoad;
    imgBackground.onload = onAssetLoad;

    // Background horizontal scroll position variable
    let bgScrollX = 0;

    // ==========================================
    // PLAYER CONFIGURATION & ANIMATION LOGIC
    // ==========================================
    const player = {
        x: 80,
        y: GROUND_Y - 50,
        width: 45,
        height: 55,
        velocityY: 0,
        jumpForce: -12,
        isGrounded: false,
        jumpCount: 0,
        maxJumps: 2,
        
        // Frame pacing for running animation loop
        animTimer: 0,
        currentFrame: 1,

        update() {
            this.velocityY += GRAVITY;
            this.y += this.velocityY;

            if (this.y + this.height >= GROUND_Y) {
                this.y = GROUND_Y - this.height;
                this.velocityY = 0;
                this.isGrounded = true;
                this.jumpCount = 0;
                
                // Track pacing ticks to swap legs while moving forward
                this.animTimer += gameSpeed * 0.05;
                if (this.animTimer > 1) {
                    this.currentFrame = this.currentFrame === 1 ? 2 : 1;
                    this.animTimer = 0;
                }
            } else {
                this.isGrounded = false;
            }
        },

        draw() {
            // Determine active custom image texture based on animation ticks
            let activeSprite = this.currentFrame === 1 ? imgPlayerRun1 : imgPlayerRun2;

            // If browser found your files, render them. If not, use the fallback shape.
            if (assetsLoaded && activeSprite.complete && activeSprite.naturalWidth !== 0) {
                ctx.drawImage(activeSprite, this.x, this.y, this.width, this.height);
            } else {
                ctx.fillStyle = "#3498db"; 
                ctx.fillRect(this.x, this.y, this.width, this.height);
                ctx.fillStyle = "#ffffff";
                ctx.fillRect(this.x + 28, this.y + 10, 10, 8);
            }
        },

        jump() {
            if (this.isGrounded || this.jumpCount < this.maxJumps) {
                this.velocityY = this.jumpForce;
                this.jumpCount++;
            }
        },

        reset() {
            this.y = GROUND_Y - this.height;
            this.velocityY = 0;
            this.isGrounded = true;
            this.jumpCount = 0;
        }
    };

    // ==========================================
    // OBSTACLE MANAGEMENT
    // ==========================================
    let obstacles = [];
    let spawnTimer = 0;
    let minSpawnInterval = 60; 
    let maxSpawnInterval = 150; 

    class Obstacle {
        constructor() {
            this.width = 35;
            this.height = 45;
            this.x = canvas.width + 20;            
            this.y = GROUND_Y - this.height;
        }

        update() {
            this.x -= gameSpeed;
        }

        draw() {
            if (assetsLoaded && imgObstacle.complete && imgObstacle.naturalWidth !== 0) {
                ctx.drawImage(imgObstacle, this.x, this.y, this.width, this.height);
            } else {
                ctx.fillStyle = "#e74c3c"; 
                ctx.fillRect(this.x, this.y, this.width, this.height);
            }
        }
    }

    function manageObstacles() {
        spawnTimer--;
        let dynamicInterval = maxSpawnInterval - ((gameSpeed / MAX_SPEED) * (maxSpawnInterval - minSpawnInterval));
        
        if (spawnTimer <= 0) {
            obstacles.push(new Obstacle());
            spawnTimer = dynamicInterval + (Math.random() * 50);
        }

        for (let i = obstacles.length - 1; i >= 0; i--) {
            obstacles[i].update();
            obstacles[i].draw();

            // Strict Collision AABB Check
            if (
                player.x < obstacles[i].x + obstacles[i].width &&
                player.x + player.width > obstacles[i].x &&
                player.y < obstacles[i].y + obstacles[i].height &&
                player.y + player.height > obstacles[i].y
            ) {
                gameState = "GAMEOVER";
                handleHighScore();
            }

            if (obstacles[i].x + obstacles[i].width < 0) {
                obstacles.splice(i, 1);
            }
        }
    }

    // High Score Processing Local Registry Engine
    function handleHighScore() {
        if (score > highScore) {
            highScore = score;
            localStorage.setItem("runner_highscore", highScore);
        }
    }

    // ==========================================
    // ENVIRONMENT SCROLL & RENDER
    // ==========================================
    function drawBackground() {
        if (assetsLoaded && imgBackground.complete && imgBackground.naturalWidth !== 0) {
            if (gameState === "PLAYING") {
                bgScrollX -= gameSpeed * 0.5; // Scroll background layer slower for depth
            }
            if (bgScrollX <= -canvas.width) {
                bgScrollX = 0;
            }
            // Seamless looping texture technique
            ctx.drawImage(imgBackground, bgScrollX, 0, canvas.width, canvas.height);
            ctx.drawImage(imgBackground, bgScrollX + canvas.width, 0, canvas.width, canvas.height);
        } else {
            // Sky standard clear fallback
            ctx.fillStyle = "#2c3e50";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }

        // Standard clean flat collision ground overlay deck
        ctx.fillStyle = "#34495e";
        ctx.fillRect(0, GROUND_Y, canvas.width, canvas.height - GROUND_Y);
        ctx.fillStyle = "#2ecc71"; 
        ctx.fillRect(0, GROUND_Y, canvas.width, 6);
    }

    function drawUI() {
        ctx.fillStyle = "#ffffff";
        ctx.font = "bold 18px 'Segoe UI', sans-serif";
        ctx.textAlign = "left";
        ctx.fillText(`SCORE: ${Math.floor(score)}`, 20, 35);
        
        ctx.fillStyle = "#f1c40f"; // Gold text for highscore distinction
        ctx.textAlign = "right";
        ctx.fillText(`HI-SCORE: ${Math.floor(highScore)}`, canvas.width - 20, 35);
    }

    function drawGameOverScreen() {
        ctx.fillStyle = "rgba(0, 0, 0, 0.8)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = "#e74c3c";
        ctx.font = "bold 46px 'Segoe UI', sans-serif";
        ctx.textAlign = "center";
        ctx.fillText("GAME OVER", canvas.width / 2, canvas.height / 2 - 30);

        ctx.fillStyle = "#ffffff";
        ctx.font = "22px 'Segoe UI', sans-serif";
        ctx.fillText(`Final Run Score: ${Math.floor(score)}`, canvas.width / 2, canvas.height / 2 + 15);
        
        ctx.fillStyle = "#f1c40f";
        ctx.fillText(`All-Time Record: ${Math.floor(highScore)}`, canvas.width / 2, canvas.height / 2 + 50);

        ctx.fillStyle = "#bdc3c7";
        ctx.font = "15px 'Segoe UI', sans-serif";
        ctx.fillText("Press [SPACEBAR] or CLICK SCREEN to Try Again", canvas.width / 2, canvas.height / 2 + 95);
    }
