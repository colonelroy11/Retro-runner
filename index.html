<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro Endless Runner - Ultimate Safe Build</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            user-select: none;
        }

        #gameContainer {
            position: relative;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            border-radius: 8px;
            overflow: hidden;
        }

        canvas {
            background-color: #2c3e50;
            display: block;
        }
    </style>
</head>
<body>

<div id="gameContainer">
    <canvas id="gameCanvas" width="800" height="400"></canvas>
</div>

<script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    // ==========================================
    // EXTENSIVE STATE TRACKING MATRIX
    // ==========================================
    let gameState = "MENU"; 
    let selectedDifficulty = 1; 
    let score = 0;
    let gameSpeed = 5;
    let maxSpeedSetting = 15;
    let speedIncrementSetting = 0.001;

    const GROUND_Y = canvas.height - 60;
    const GRAVITY = 0.6;

    let scorePopups = [];
    let particles = [];

    // ==========================================
    // ANTI-CRASH STORAGE SYSTEM SAFETY NET
    // ==========================================
    let highScore = 0;
    let totalCoins = 0;

    try {
        if (localStorage.getItem("runner_highscore")) {
            highScore = parseFloat(localStorage.getItem("runner_highscore"));
        }
        if (localStorage.getItem("runner_coinbank")) {
            totalCoins = parseInt(localStorage.getItem("runner_coinbank"));
        }
    } catch (e) {
        console.warn("Storage access denied by browser settings. Using session memory instead.");
    }

    function saveData(key, value) {
        try {
            localStorage.setItem(key, value);
        } catch (e) {
            // Silently absorb if blocked so it never freezes the game loop
        }
    }

    // ==========================================
    // WEB AUDIO OSCILLATOR SYNTHESIZER
    // ==========================================
    let audioCtx = null;

    function initAudio() {
        if (!audioCtx) {
            try {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            } catch (e) {
                console.warn("Audio context not supported.");
            }
        }
    }

    function playSound(type) {
        if (!audioCtx) return;
        if (audioCtx.state === 'suspended') {
            audioCtx.resume();
        }

        const osc = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        osc.connect(gainNode);
        gainNode.connect(audioCtx.destination);

        const now = audioCtx.currentTime;

        if (type === "JUMP") {
            osc.type = "triangle";
            osc.frequency.setValueAtTime(150, now);
            osc.frequency.exponentialRampToValueAtTime(400, now + 0.12);
            gainNode.gain.setValueAtTime(0.15, now);
            gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.12);
            osc.start(now);
            osc.stop(now + 0.12);
        } 
        else if (type === "COIN") {
            osc.type = "sine";
            osc.frequency.setValueAtTime(587.33, now); 
            osc.frequency.setValueAtTime(880, now + 0.06);   
            gainNode.gain.setValueAtTime(0.15, now);
            gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
            osc.start(now);
            osc.stop(now + 0.2);
        } 
        else if (type === "ITEM") {
            osc.type = "sine";
            osc.frequency.setValueAtTime(523.25, now); 
            osc.frequency.setValueAtTime(659.25, now + 0.05); 
            osc.frequency.setValueAtTime(783.99, now + 0.1); 
            osc.frequency.setValueAtTime(1046.50, now + 0.15); 
            gainNode.gain.setValueAtTime(0.15, now);
            gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
            osc.start(now);
            osc.stop(now + 0.3);
        } 
        else if (type === "HIT") {
            osc.type = "sawtooth";
            osc.frequency.setValueAtTime(120, now);
            osc.frequency.linearRampToValueAtTime(40, now + 0.4);
            gainNode.gain.setValueAtTime(0.3, now);
            gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
            osc.start(now);
            osc.stop(now + 0.4);
        }
        else if (type === "SELECT") {
            osc.type = "square";
            osc.frequency.setValueAtTime(300, now);
            gainNode.gain.setValueAtTime(0.08, now);
            gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.05);
            osc.start(now);
            osc.stop(now + 0.05);
        }
    }

    // ==========================================================
    // IMAGE LOADER CHECKS
    // ==========================================================
    let heroLoaded = false;
    let obstacleLoaded = false;
    let coinLoaded = false;
    let itemLoaded = false;

    const imgPlayer = new Image();
    imgPlayer.onload = () => { heroLoaded = true; };
    imgPlayer.src = "./hero.png"; 

    const imgObstacle = new Image();
    imgObstacle.onload = () => { obstacleLoaded = true; };
    imgObstacle.src = "./obstacle.png";       

    const imgCoin = new Image();
    imgCoin.onload = () => { coinLoaded = true; };
    imgCoin.src = "./coin.png";   

    const imgItem = new Image();
    imgItem.onload = () => { itemLoaded = true; };
    imgItem.src = "./item.png";

    // ==========================================
    // PLAYER CONFIGURATION
    // ==========================================
    const player = {
        x: 80,
        y: GROUND_Y - 60,
        width: 50,  
        height: 60,
        velocityY: 0,
        jumpForce: -13,
        isGrounded: false,
        jumpCount: 0,
        maxJumps: 2,

        update() {
            this.velocityY += GRAVITY;
            this.y += this.velocityY;

            if (this.y + this.height >= GROUND_Y) {
                this.y = GROUND_Y - this.height;
                this.velocityY = 0;
                this.isGrounded = true;
                this.jumpCount = 0;
            } else {
                this.isGrounded = false;
            }
        },

        draw() {
            if (heroLoaded && imgPlayer.complete && imgPlayer.naturalWidth > 0) {
                ctx.drawImage(imgPlayer, this.x, this.y, this.width, this.height);
            } else {
                ctx.fillStyle = "#00d2d3"; 
                ctx.fillRect(this.x, this.y, this.width, this.height);
            }
        },

        reset() {
            this.y = GROUND_Y - this.height;
            this.velocityY = 0;
            this.isGrounded = true;
            this.jumpCount = 0;
        }
    };

    // ==========================================
    // RANDOMIZED OBSTACLE CORES
    // ==========================================
    let obstacles = [];
    let spawnTimer = 0;
    let minSpawnInterval = 70; 
    let maxSpawnInterval = 160; 

    class Obstacle {
        constructor() {
            this.width = 30 + Math.random() * 25;  
            this.height = 35 + Math.random() * 30; 
            this.x = canvas.width + 20;            
            this.y = GROUND_Y - this.height;
        }

        update() {
            this.x -= gameSpeed;
        }

        draw() {
            if (obstacleLoaded && imgObstacle.complete && imgObstacle.naturalWidth > 0) {
                ctx.drawImage(imgObstacle, this.x, this.y, this.width, this.height);
            } else {
                ctx.fillStyle = "#ff6b6b"; 
                ctx.fillRect(this.x, this.y, this.width, this.height);
            }
        }
    }

    // ==========================================
    // COLLECTIBLE ITEM DESIGN
    // ==========================================
    let collectibles = [];
    let collectibleSpawnTimer = 100;

    class Collectible {
        constructor(type) {
            this.type = type; 
            this.width = 30;
            this.height = 30;
            this.x = canvas.width + 20;
            this.y = GROUND_Y - this.height - (Math.random() > 0.5 ? 0 : 70); 
        }

        update() {
            this.x -= gameSpeed;
        }

        draw() {
            if (this.type === "COIN") {
                if (coinLoaded && imgCoin.complete && imgCoin.naturalWidth > 0) {
                    ctx.drawImage(imgCoin, this.x, this.y, this.width, this.height);
                } else {
                    ctx.fillStyle = "#f1c40f"; 
                    ctx.beginPath();
                    ctx.arc(this.x + this.width/2, this.y + this.height/2, this.width/2, 0, Math.PI*2);
                    ctx.fill();
                }
            } else {
                if (itemLoaded && imgItem.complete && imgItem.naturalWidth > 0) {
                    ctx.drawImage(imgItem, this.x, this.y, this.width, this.height);
                } else {
                    ctx.fillStyle = "#9b59b6"; 
                    ctx.beginPath();
                    ctx.arc(this.x + this.width/2, this.y + this.height/2, this.width/2, 0, Math.PI*2);
                    ctx.fill();
                }
            }
        }
    }

    // ==========================================
    // PARTICLE ENGINE EXTRACTIONS
    // ==========================================
    class Particle {
        constructor(x, y, color) {
            this.x = x;
            this.y = y;
            this.color = color;
            this.radius = 2 + Math.random() * 3;
