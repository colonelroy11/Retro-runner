<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro Endless Runner</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            user-select: none;
        }

        #gameContainer {
            position: relative;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            border-radius: 8px;
            overflow: hidden;
        }

        canvas {
            background-color: #2c3e50;
            display: block;
        }
    </style>
</head>
<body>

<div id="gameContainer">
    <canvas id="gameCanvas" width="800" height="400"></canvas>
</div>

<script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    // Game state tracking
    let gameState = "PLAYING"; 
    let score = 0;
    let gameSpeed = 5;
    const MAX_SPEED = 15;
    const SPEED_INCREMENT = 0.001;

    // Environmental constants
    const GROUND_Y = canvas.height - 60;
    const GRAVITY = 0.6;

    // Persistent High Score System via Browser LocalStorage
    let highScore = localStorage.getItem("runner_highscore") ? parseFloat(localStorage.getItem("runner_highscore")) : 0;

    // ==========================================================
    // EXACT FILENAME MATCHING FROM YOUR GITHUB REPOSITORY
    // ==========================================================
    const imgPlayer = new Image();
    imgPlayer.src = "./hero.png"; 

    const imgObstacle = new Image();
    imgObstacle.src = "./obstacle.png";       

    const imgCoin = new Image();
    imgCoin.src = "./coin.png";   

    const imgItem = new Image();
    imgItem.src = "./item.png";

    // ==========================================
    // PLAYER CONFIGURATION
    // ==========================================
    const player = {
        x: 80,
        y: GROUND_Y - 60,
        width: 50,  // Proportional box size for image rendering
        height: 60,
        velocityY: 0,
        jumpForce: -13,
        isGrounded: false,
        jumpCount: 0,
        maxJumps: 2,

        update() {
            this.velocityY += GRAVITY;
            this.y += this.velocityY;

            if (this.y + this.height >= GROUND_Y) {
                this.y = GROUND_Y - this.height;
                this.velocityY = 0;
                this.isGrounded = true;
                this.jumpCount = 0;
            } else {
                this.isGrounded = false;
            }
        },

        draw() {
            if (imgPlayer.complete && imgPlayer.naturalWidth !== 0) {
                ctx.drawImage(imgPlayer, this.x, this.y, this.width, this.height);
            } else {
                // Vector fallback box visible if assets fail to link
                ctx.fillStyle = "#3498db"; 
                ctx.fillRect(this.x, this.y, this.width, this.height);
            }
        }
    };

    // ==========================================
    // OBSTACLE MANAGEMENT
    // ==========================================
    let obstacles = [];
    let spawnTimer = 0;
    let minSpawnInterval = 70; 
    let maxSpawnInterval = 160; 

    class Obstacle {
        constructor() {
            this.width = 40;
            this.height = 50;
            this.x = canvas.width + 20;            
            this.y = GROUND_Y - this.height;
        }

        update() {
            this.x -= gameSpeed;
        }

        draw() {
            if (imgObstacle.complete && imgObstacle.naturalWidth !== 0) {
                ctx.drawImage(imgObstacle, this.x, this.y, this.width, this.height);
            } else {
                ctx.fillStyle = "#e74c3c"; 
                ctx.fillRect(this.x, this.y, this.width, this.height);
            }
        }
    }

    function manageObstacles() {
        spawnTimer--;
        let dynamicInterval = maxSpawnInterval - ((gameSpeed / MAX_SPEED) * (maxSpawnInterval - minSpawnInterval));
        
        if (spawnTimer <= 0) {
            obstacles.push(new Obstacle());
            spawnTimer = dynamicInterval + (Math.random() * 60);
        }

        for (let i = obstacles.length - 1; i >= 0; i--) {
            obstacles[i].update();
            obstacles[i].draw();

            // Collision Processing
            if (
                player.x < obstacles[i].x + obstacles[i].width &&
                player.x + player.width > obstacles[i].x &&
                player.y < obstacles[i].y + obstacles[i].height &&
                player.y + player.height > obstacles[i].y
            ) {
                gameState = "GAMEOVER";
                handleHighScore();
            }

            if (obstacles[i].x + obstacles[i].width < 0) {
                obstacles.splice(i, 1);
            }
        }
    }

    function handleHighScore() {
        if (score > highScore) {
            highScore = score;
            localStorage.setItem("runner_highscore", highScore);
        }
    }

    // ==========================================
    // ENVIRONMENT SCENERY RENDERING
    // ==========================================
    function drawBackground() {
        // Since background.png doesn't exist, we render a stylized retro sky grid background
        ctx.fillStyle = "#1e272e";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Subtle geometric sky stars/details
        ctx.fillStyle = "rgba(255, 255, 255, 0.1)";
        for (let i = 0; i < canvas.width; i += 80) {
            ctx.fillRect(i + 20, 50, 4, 4);
            ctx.fillRect(i + 60, 150, 2, 2);
        }

        // Base ground floor layer platform deck
        ctx.fillStyle = "#2d3436";
        ctx.fillRect(0, GROUND_Y, canvas.width, canvas.height - GROUND_Y);
        
        // High contrast ground floor separating line stripe
        ctx.fillStyle = "#00d2d3"; 
        ctx.fillRect(0, GROUND_Y, canvas.width, 6);
    }

    function drawUI() {
        ctx.fillStyle = "#ffffff";
        ctx.font = "bold 18px 'Segoe UI', sans-serif";
        ctx.textAlign = "left";
        ctx.fillText(`SCORE: ${Math.floor(score)}`, 20, 35);
        
        ctx.fillStyle = "#f1c40f"; 
        ctx.textAlign = "right";
        ctx.fillText(`HI-SCORE: ${Math.floor(highScore)}`, canvas.width - 20, 35);
    }

    function drawGameOverScreen() {
        ctx.fillStyle = "rgba(0, 0, 0, 0.85)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = "#e74c3c";
        ctx.font = "bold 46px 'Segoe UI', sans-serif";
        ctx.textAlign = "center";
        ctx.fillText("GAME OVER", canvas.width / 2, canvas.height / 2 - 30);

        ctx.fillStyle = "#ffffff";
        ctx.font = "22px 'Segoe UI', sans-serif";
        ctx.fillText(`Final Run Score: ${Math.floor(score)}`, canvas.width / 2, canvas.height / 2 + 15);
        
        ctx.fillStyle = "#f1c40f";
        ctx.fillText(`All-Time Record: ${Math.floor(highScore)}`, canvas.width / 2, canvas.height / 2 + 50);

        ctx.fillStyle = "#bdc3c7";
        ctx.font = "15px 'Segoe UI', sans-serif";
        ctx.fillText("Press [SPACEBAR] or CLICK HERE to Try Again", canvas.width / 2, canvas.height / 2 + 95);
    }

    // ==========================================
    // INPUT ENGINES
    // ==========================================
    function triggerAction() {
        if (gameState === "PLAYING") {
            player.jump();
        } else if (gameState === "GAMEOVER") {
            resetGame();
        }
    }

    window.addEventListener("keydown", (e) => {
        if (e.code === "Space") {
            e.preventDefault();
            triggerAction();
        }
    });

    canvas.addEventListener("mousedown", (e) => {
        if (e.button === 0) triggerAction();
    });
    canvas.addEventListener("touchstart", (e) => {
        e.preventDefault();
        triggerAction();
    });

    function resetGame() {
        obstacles = [];
        score = 0;
        gameSpeed = 5;
        spawnTimer = 0;
        player.reset();
        gameState = "PLAYING";
    }

    function gameLoop() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        drawBackground();

        if (gameState === "PLAYING") {
            if (gameSpeed < MAX_SPEED) gameSpeed += SPEED_INCREMENT;
            player.update();
            score += 0.15;

            player.draw();
            manageObstacles();
            drawUI();
        } else if (gameState === "GAMEOVER") {
            player.draw();
            for (let obs of obstacles) obs.draw();
            drawUI();
            drawGameOverScreen();
        }

        requestAnimationFrame(gameLoop);
    }

    gameLoop();
</script>

</body>
</html>
