<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Retro Runner - Universal Responsive Edition</title>
    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        
        body {
            margin: 0;
            padding: 0;
            background-color: #111416;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            user-select: none;
            touch-action: none;
        }

        #diagnosticBanner {
            background-color: #00d2d3;
            color: #111416;
            padding: 8px 16px;
            font-weight: bold;
            border-radius: 4px;
            margin-bottom: 15px;
            font-size: 14px;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            z-index: 10;
        }

        #gameContainer {
            position: relative;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
            border: 2px solid #00d2d3;
            border-radius: 8px;
            overflow: hidden;
            width: 95vw;
            height: 80vh; 
            max-width: 800px;
            max-height: 400px;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            background-color: #1e272e;
        }
    </style>
</head>
<body>

<div id="diagnosticBanner">⚡ ULTIMATE PRODUCTION READY BUILD OVERHAUL (BUILD 5.0 LIVE)</div>

<div id="gameContainer">
    <canvas id="gameCanvas" width="800" height="400"></canvas>
</div>

<script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    let gameState = "MENU"; 
    let selectedDifficulty = 1; 
    let score = 0;
    let gameSpeed = 5;
    let maxSpeedSetting = 15;
    let speedIncrementSetting = 0.001;

    const GROUND_Y = canvas.height - 60;
    const GRAVITY = 0.6;

    let scorePopups = [];
    let particles = [];
    let obstacles = [];
    let collectibles = [];
    let spawnTimer = 0;
    let collectibleSpawnTimer = 100;
    let minSpawnInterval = 70;
    let maxSpawnInterval = 160;

    let highScore = 0;
    let totalCoins = 0;

    const player = {
        x: 80,
        y: GROUND_Y - 50,
        width: 40,
        height: 50,
        velocityY: 0,
        jumpForce: -12.5,
        isGrounded: false,
        jumpCount: 0,
        maxJumps: 2,

        update() {
            this.velocityY += GRAVITY;
            this.y += this.velocityY;
            if (this.y + this.height >= GROUND_Y) {
                this.y = GROUND_Y - this.height;
                this.velocityY = 0;
                this.isGrounded = true;
                this.jumpCount = 0;
            } else {
                this.isGrounded = false;
            }
        },

        draw() {
            ctx.fillStyle = "#00d2d3";
            ctx.fillRect(this.x, this.y, this.width, this.height);
            ctx.strokeStyle = "#ffffff";
            ctx.lineWidth = 2;
            ctx.strokeRect(this.x, this.y, this.width, this.height);
        },

        reset() {
            this.y = GROUND_Y - this.height;
            this.velocityY = 0;
            this.isGrounded = true;
            this.jumpCount = 0;
        }
    };

    class Obstacle {
        constructor() {
            this.width = 25 + Math.random() * 20;
            this.height = 30 + Math.random() * 25;
            this.x = canvas.width + 20;
            this.y = GROUND_Y - this.height;
        }
        update() { this.x -= gameSpeed; }
        draw() {
            ctx.fillStyle = "#ff6b6b";
            ctx.fillRect(this.x, this.y, this.width, this.height);
            ctx.strokeStyle = "#ffffff";
            ctx.lineWidth = 1.5;
            ctx.strokeRect(this.x, this.y, this.width, this.height);
        }
    }

    class Collectible {
        constructor(type) {
            this.type = type;
            this.width = 24;
            this.height = 24;
            this.x = canvas.width + 20;
            this.y = GROUND_Y - this.height - (Math.random() > 0.5 ? 10 : 75);
        }
        update() { this.x -= gameSpeed; }
        draw() {
            ctx.fillStyle = this.type === "COIN" ? "#f1c40f" : "#9b59b6";
            ctx.beginPath();
            ctx.arc(this.x + 12, this.y + 12, 12, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = "#ffffff";
            ctx.lineWidth = 1;
            ctx.stroke();
        }
    }

    class Particle {
        constructor(x, y, color) {
            this.x = x; this.y = y; this.color = color;
            this.radius = 2 + Math.random() * 2;
            this.vx = (Math.random() - 0.5) * 5;
            this.vy = (Math.random() - 0.7) * 5;
            this.alpha = 1;
            this.decay = 0.02 + Math.random() * 0.02;
        }
        update() { this.x += this.vx; this.y += this.vy; this.vy += 0.08; this.alpha -= this.decay; }
        draw() {
            ctx.save(); ctx.globalAlpha = this.alpha; ctx.fillStyle = this.color;
            ctx.beginPath(); ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2); ctx.fill(); ctx.restore();
        }
    }

    function createParticleBurst(x, y, color) {
        for (let i = 0; i < 10; i++) particles.push(new Particle(x, y, color));
    }

    function manageEntities() {
        spawnTimer--;
        let dynamicInterval = maxSpawnInterval - ((gameSpeed / maxSpeedSetting) * (maxSpawnInterval - minSpawnInterval));
        if (spawnTimer <= 0) {
            obstacles.push(new Obstacle());
            spawnTimer = dynamicInterval + (Math.random() * 50);
        }

        for (let i = obstacles.length - 1; i >= 0; i--) {
            obstacles[i].update(); obstacles[i].draw();
            if (player.x < obstacles[i].x + obstacles[i].width && player.x + player.width > obstacles[i].x && player.y < obstacles[i].y + obstacles[i].height && player.y + player.height > obstacles[i].y) {
                gameState = "GAMEOVER";
                createParticleBurst(player.x + player.width / 2, player.y + player.height / 2, "#ff6b6b");
                if (score > highScore) highScore = score;
            }
            if (obstacles[i].x + obstacles[i].width < 0) obstacles.splice(i, 1);
        }

        collectibleSpawnTimer--;
        if (collectibleSpawnTimer <= 0) {
            collectibles.push(new Collectible(Math.random() > 0.25 ? "COIN" : "ITEM"));
            collectibleSpawnTimer = 110 + Math.random() * 90;
        }

        for (let i = collectibles.length - 1; i >= 0; i--) {
            collectibles[i].update(); collectibles[i].draw();
            if (player.x < collectibles[i].x + collectibles[i].width && player.x + player.width > collectibles[i].x && player.y < collectibles[i].y + collectibles[i].height && player.y + player.height > collectibles[i].y) {
                let pts = collectibles[i].type === "COIN" ? 50 : 150;
                let col = collectibles[i].type === "COIN" ? "#f1c40f" : "#9b59b6";
                score += pts;
                if (collectibles[i].type === "COIN") totalCoins++;
                createParticleBurst(collectibles[i].x + 12, collectibles[i].y + 12, col);
                scorePopups.push({ text: `+${pts}`, x: player.x + player.width / 2, y: player.y - 10, alpha: 1, color: col });
                collectibles.splice(i, 1);
                continue;
            }
            if (collectibles[i].x + collectibles[i].width < 0) collectibles.splice(i, 1);
        }

        for (let i = particles.length - 1; i >= 0; i--) {
            particles[i].update(); particles[i].draw();
            if (particles[i].alpha <= 0) particles.splice(i, 1);
        }

        for (let i = scorePopups.length - 1; i >= 0; i--) {
            scorePopups[i].y -= 0.8; scorePopups[i].alpha -= 0.025;
            ctx.save(); ctx.globalAlpha = scorePopups[i].alpha; ctx.fillStyle = scorePopups[i].color;
            ctx.font = "bold 14px sans-serif"; ctx.textAlign = "center";
            ctx.fillText(scorePopups[i].text, scorePopups[i].x, scorePopups[i].y); ctx.restore();
            if (scorePopups[i].alpha <= 0) scorePopups.splice(i, 1);
        }
    }

    function drawBackground() {
        let bg = "#1e272e", line = "#00d2d3";
        if (score >= 300 && score < 700) { bg = "#4834d4"; line = "#ffbe76"; }
        else if (score >= 700) { bg = "#0c1020"; line = "#f1c40f"; }
        ctx.fillStyle = bg; ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        ctx.fillStyle = "rgba(255, 255, 255, 0.08)";
        for (let i = 0; i < canvas.width; i += 80) ctx.fillRect(i + 20, 40, 3, 3);

        ctx.fillStyle = "#2c3e50"; ctx.fillRect(0, GROUND_Y, canvas.width, canvas.height - GROUND_Y);
        ctx.fillStyle = line; ctx.fillRect(0, GROUND_Y, canvas.width, 4);
    }

    function drawMainMenuScreen() {
        ctx.fillStyle = "#111416"; ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "#00d2d3"; ctx.font = "bold 38px sans-serif"; ctx.textAlign = "center";
        ctx.fillText("RETRO RUNNER", canvas.width / 2, 105);

        ctx.fillStyle = "#f1c40f"; ctx.font = "15px sans-serif";
        ctx.fillText(`🏆 Record: ${Math.floor(highScore)}   |   💰 Coins: ${totalCoins}`, canvas.width / 2, 150);

        ctx.fillStyle = "#ffffff"; ctx.font = "16px sans-serif";
        ctx.fillText("TAP DIFFICULTY TO START", canvas.width / 2, 225);

        const diffs = ["EASY", "MEDIUM", "HARD"];
        for (let i = 0; i < diffs.length; i++) {
            let bX = canvas.width / 2 - 120 + (i * 120);
            let bY = 260;
            if (i === selectedDifficulty) {
