<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro Endless Runner - Ultimate Master Edition</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            user-select: none;
        }

        #gameContainer {
            position: relative;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            border-radius: 8px;
            overflow: hidden;
        }

        canvas {
            background-color: #2c3e50;
            display: block;
        }
    </style>
</head>
<body>

<div id="gameContainer">
    <canvas id="gameCanvas" width="800" height="400"></canvas>
</div>

<script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    // ==========================================
    // EXTENSIVE STATE TRACKING MATRIX
    // ==========================================
    let gameState = "MENU"; // States: "MENU", "PLAYING", "GAMEOVER"
    let selectedDifficulty = 1; // 0 = Easy, 1 = Medium, 2 = Hard
    let score = 0;
    let gameSpeed = 5;
    let maxSpeedSetting = 15;
    let speedIncrementSetting = 0.001;

    // Environmental constants
    const GROUND_Y = canvas.height - 60;
    const GRAVITY = 0.6;

    // Visual tracking arrays
    let scorePopups = [];
    let particles = [];

    // ==========================================
    // PERSISTENT STORAGE SYSTEMS
    // ==========================================
    let highScore = localStorage.getItem("runner_highscore") ? parseFloat(localStorage.getItem("runner_highscore")) : 0;
    let totalCoins = localStorage.getItem("runner_coinbank") ? parseInt(localStorage.getItem("runner_coinbank")) : 0;

    // ==========================================
    // WEB AUDIO OSCILLATOR SYNTHESIZER
    // ==========================================
    let audioCtx = null;

    function initAudio() {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
    }

    function playSound(type) {
        if (!audioCtx) return;
        if (audioCtx.state === 'suspended') {
            audioCtx.resume();
        }

        const osc = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        osc.connect(gainNode);
        gainNode.connect(audioCtx.destination);

        const now = audioCtx.currentTime;

        if (type === "JUMP") {
            osc.type = "triangle";
            osc.frequency.setValueAtTime(150, now);
            osc.frequency.exponentialRampToValueAtTime(400, now + 0.12);
            gainNode.gain.setValueAtTime(0.15, now);
            gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.12);
            osc.start(now);
            osc.stop(now + 0.12);
        } 
        else if (type === "COIN") {
            osc.type = "sine";
            osc.frequency.setValueAtTime(587.33, now); 
            osc.frequency.setValueAtTime(880, now + 0.06);   
            gainNode.gain.setValueAtTime(0.15, now);
            gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
            osc.start(now);
            osc.stop(now + 0.2);
        } 
        else if (type === "ITEM") {
            osc.type = "sine";
            osc.frequency.setValueAtTime(523.25, now); 
            osc.frequency.setValueAtTime(659.25, now + 0.05); 
            osc.frequency.setValueAtTime(783.99, now + 0.1); 
            osc.frequency.setValueAtTime(1046.50, now + 0.15); 
            gainNode.gain.setValueAtTime(0.15, now);
            gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
            osc.start(now);
            osc.stop(now + 0.3);
        } 
        else if (type === "HIT") {
            osc.type = "sawtooth";
            osc.frequency.setValueAtTime(120, now);
            osc.frequency.linearRampToValueAtTime(40, now + 0.4);
            gainNode.gain.setValueAtTime(0.3, now);
            gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
            osc.start(now);
            osc.stop(now + 0.4);
        }
        else if (type === "SELECT") {
            osc.type = "square";
            osc.frequency.setValueAtTime(300, now);
            gainNode.gain.setValueAtTime(0.08, now);
            gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.05);
            osc.start(now);
            osc.stop(now + 0.05);
        }
    }

    // ==========================================================
    // REPOSITORY IMAGE LOADER MAPS
    // ==========================================================
    const imgPlayer = new Image();
    imgPlayer.src = "./hero.png"; 

    const imgObstacle = new Image();
    imgObstacle.src = "./obstacle.png";       

    const imgCoin = new Image();
    imgCoin.src = "./coin.png";   

    const imgItem = new Image();
    imgItem.src = "./item.png";

    // ==========================================
    // PLAYER CONFIGURATION
    // ==========================================
    const player = {
        x: 80,
        y: GROUND_Y - 60,
        width: 50,  
        height: 60,
        velocityY: 0,
        jumpForce: -13,
        isGrounded: false,
        jumpCount: 0,
        maxJumps: 2,

        update() {
            this.velocityY += GRAVITY;
            this.y += this.velocityY;

            if (this.y + this.height >= GROUND_Y) {
                this.y = GROUND_Y - this.height;
                this.velocityY = 0;
                this.isGrounded = true;
                this.jumpCount = 0;
            } else {
                this.isGrounded = false;
            }
        },

        draw() {
            if (imgPlayer.complete && imgPlayer.naturalWidth !== 0) {
                ctx.drawImage(imgPlayer, this.x, this.y, this.width, this.height);
            } else {
                ctx.fillStyle = "#3498db"; 
                ctx.fillRect(this.x, this.y, this.width, this.height);
            }
        },

        reset() {
            this.y = GROUND_Y - this.height;
            this.velocityY = 0;
            this.isGrounded = true;
            this.jumpCount = 0;
        }
    };

    // ==========================================
    // RANDOMIZED OBSTACLE MANIFESTS
    // ==========================================
    let obstacles = [];
    let spawnTimer = 0;
    let minSpawnInterval = 70; 
    let maxSpawnInterval = 160; 

    class Obstacle {
        constructor() {
            this.width = 30 + Math.random() * 25;  
            this.height = 35 + Math.random() * 30; 
            this.x = canvas.width + 20;            
            this.y = GROUND_Y - this.height;
        }

        update() {
            this.x -= gameSpeed;
        }

        draw() {
            if (imgObstacle.complete && imgObstacle.naturalWidth !== 0) {
                ctx.drawImage(imgObstacle, this.x, this.y, this.width, this.height);
            } else {
                ctx.fillStyle = "#e74c3c"; 
                ctx.fillRect(this.x, this.y, this.width, this.height);
            }
        }
    }

    // ==========================================
    // COLLECTIBLE ITEM DESIGN
    // ==========================================
    let collectibles = [];
    let collectibleSpawnTimer = 100;

    class Collectible {
        constructor(type) {
            this.type = type; 
            this.width = 30;
            this.height = 30;
            this.x = canvas.width + 20;
            this.y = GROUND_Y - this.height - (Math.random() > 0.5 ? 0 : 70); 
        }

        update() {
            this.x -= gameSpeed;
        }

        draw() {
            let activeImg = this.type === "COIN" ? imgCoin : imgItem;
            if (activeImg.complete && activeImg.naturalWidth !== 0) {
                ctx.drawImage(activeImg, this.x, this.y, this.width, this.height);
            } else {
                ctx.fillStyle = this.type === "COIN" ? "#f1c40f" : "#9b59b6";
                ctx.beginPath();
                ctx.arc(this.x + this.width/2, this.y + this.height/2, this.width/2, 0, Math.PI*2);
                ctx.fill();
            }
        }
    }

    // ==========================================
    // ENHANCED PARTICLE SYSTEM ENGINE
    // ==========================================
    class Particle {
        constructor(x, y, color) {
            this.x = x;
            this.y = y;
            this.color = color;
            this.radius = 2 + Math.random() * 3;
            this.vx = (Math.random() - 0.5) * 6;
            this.vy = (Math.random() - 0.7) * 6; 
            this.alpha = 1;
            this.decay = 0.02 + Math.random() * 0.02;
        }

        update() {
            this.x += this.vx;
            this.y += this.vy;
            this.vy += 0.1; 
            this.alpha -= this.decay;
        }

        draw() {
            ctx.save();
            ctx.globalAlpha = this.alpha;
            ctx.fillStyle = this.color;
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
        }
    }

    function createParticleBurst(x, y, color) {
        for (let i = 0; i < 15; i++) {
            particles.push(new Particle(x, y, color));
        }
    }

    // ==========================================
    // CORE SCENE RUNTIME UPDATE LOOPS
    // ==========================================
    function manageEntities() {
        // --- 1. Handle Obstacles ---
        spawnTimer--;
        let dynamicInterval = maxSpawnInterval - ((gameSpeed / maxSpeedSetting) * (maxSpawnInterval - minSpawnInterval));
        if (spawnTimer <= 0) {
