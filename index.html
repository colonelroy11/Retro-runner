<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro Runner Loader</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #111416;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: Arial, sans-serif;
            color: #ffffff;
        }
        #loader {
            font-size: 18px;
            font-weight: bold;
            color: #00d2d3;
        }
    </style>
</head>
<body>

<div id="loader">Bypassing browser cache and initializing game loop...</div>

<script>
    // This function forces the browser to pull a fresh copy directly from GitHub's servers
    async function loadFreshGame() {
        try {
            // Appending a random timestamp prevents the browser from loading a cached version
            const cacheBuster = "?t=" + new Date().getTime();
            const response = await fetch("https://githubusercontent.com" + cacheBuster);
            const rawHtml = await response.text();
            
            // Isolate the game content from this loader shell
            if (rawHtml.includes("btnEasy")) {
                document.open();
                document.write(rawHtml);
                document.close();
            } else {
                // Fallback to injecting the direct engine script if raw layout fails
                loadEngineDirectly();
            }
        } catch (error) {
            loadEngineDirectly();
        }
    }

    function loadEngineDirectly() {
        document.body.innerHTML = `
            <div id="gameContainer" style="position:relative;box-shadow:0 10px 30px rgba(0,0,0,0.7);border:2px solid #00d2d3;border-radius:8px;overflow:hidden;width:92vw;height:85vh;max-width:420px;max-height:740px;background-color:#111416;margin:auto;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:20px;">
                <h1 style="color:#00d2d3;font-size:32px;margin:0 0 10px 0;">RETRO RUNNER</h1>
                <div style="color:#f1c40f;font-size:14px;margin-bottom:30px;">🎮 Touch Engine Active</div>
                <div style="font-size:16px;margin-bottom:20px;font-weight:bold;">SELECT DIFFICULTY:</div>
                <div style="display:flex;flex-direction:column;gap:12px;width:80%;max-width:200px;">
                    <button id="e" style="background:#2c3e50;border:2px solid #00d2d3;color:#ffffff;padding:12px 20px;font-size:14px;font-weight:bold;border-radius:6px;cursor:pointer;">EASY</button>
                    <button id="m" style="background:#2c3e50;border:2px solid #00d2d3;color:#ffffff;padding:12px 20px;font-size:14px;font-weight:bold;border-radius:6px;cursor:pointer;">MEDIUM</button>
                    <button id="h" style="background:#2c3e50;border:2px solid #00d2d3;color:#ffffff;padding:12px 20px;font-size:14px;font-weight:bold;border-radius:6px;cursor:pointer;">HARD</button>
                </div>
                <canvas id="gameCanvas" width="400" height="700" style="display:none;position:absolute;top:0;left:0;width:100%;height:100%;z-index:10;"></canvas>
            </div>
        `;

        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        let gameState = "PLAYING";
        let score = 0;
        let gameSpeed = 5;
        const GROUND_Y = 580;
        let obstacles = [];
        let collectibles = [];
        let spawnTimer = 0;

        const player = {
            x: 60, y: GROUND_Y - 50, width: 40, height: 50, velocityY: 0, jumpForce: -13.5, isGrounded: false, jumpCount: 0, maxJumps: 2,
            update() {
                this.velocityY += 0.6; this.y += this.velocityY;
                if (this.y + this.height >= GROUND_Y) { this.y = GROUND_Y - this.height; this.velocityY = 0; this.isGrounded = true; this.jumpCount = 0; }
                else { this.isGrounded = false; }
            },
            draw() { ctx.fillStyle = "#00d2d3"; ctx.fillRect(this.x, this.y, this.width, this.height); ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 2; ctx.strokeRect(this.x, this.y, this.width, this.height); }
        };

        class Obstacle {
            constructor() { this.width = 30; this.height = 40; this.x = canvas.width + 20; this.y = GROUND_Y - this.height; }
            update() { this.x -= gameSpeed; }
            draw() { ctx.fillStyle = "#ff6b6b"; ctx.fillRect(this.x, this.y, this.width, this.height); ctx.strokeStyle = "#ffffff"; ctx.strokeRect(this.x, this.y, this.width, this.height); }
        }

        class Collectible {
            constructor() { this.width = 24; this.height = 24; this.x = canvas.width + 20; this.y = GROUND_Y - 70; }
            update() { this.x -= gameSpeed; }
            draw() { ctx.fillStyle = "#f1c40f"; ctx.beginPath(); ctx.arc(this.x + 12, this.y + 12, 12, 0, Math.PI * 2); ctx.fill(); ctx.strokeStyle = "#ffffff"; ctx.stroke(); }
        }

        function start(speed) {
            gameSpeed = speed;
            document.getElementById("e").parentElement.parentElement.style.background = "transparent";
            document.getElementById("e").parentElement.style.display = "none";
            canvas.style.display = "block";
            loop();
        }

        document.getElementById("e").addEventListener("click", function() { start(4); });
        document.getElementById("m").addEventListener("click", function() { start(5.5); });
        document.getElementById("h").addEventListener("click", function() { start(7.5); });

        canvas.addEventListener("pointerdown", function(e) {
            e.preventDefault();
            if (gameState === "PLAYING" && (player.isGrounded || player.jumpCount < player.maxJumps)) { player.velocityY = player.jumpForce; player.jumpCount++; }
            if (gameState === "GAMEOVER") { obstacles = []; collectibles = []; score = 0; player.y = GROUND_Y - player.height; player.velocityY = 0; gameState = "PLAYING"; }
        });

        function loop() {
            ctx.fillStyle = "#1e272e"; ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "#2c3e50"; ctx.fillRect(0, GROUND_Y, canvas.width, canvas.height - GROUND_Y);
            ctx.fillStyle = "#00d2d3"; ctx.fillRect(0, GROUND_Y, canvas.width, 4);

            if (gameState === "PLAYING") {
                gameSpeed += 0.001; player.update(); player.draw(); score += 0.15;
                spawnTimer--; if (spawnTimer <= 0) { obstacles.push(new Obstacle()); spawnTimer = 110 + Math.random() * 50; }
                for (let i = obstacles.length - 1; i >= 0; i--) {
                    obstacles[i].update(); obstacles[i].draw();
                    if (player.x < obstacles[i].x + obstacles[i].width && player.x + player.width > obstacles[i].x && player.y < obstacles[i].y + obstacles[i].height && player.y + player.height > obstacles[i].y) { gameState = "GAMEOVER"; }
                    if (obstacles[i].x + obstacles[i].width < 0) obstacles.splice(i, 1);
                }
                ctx.fillStyle = "#ffffff"; ctx.font = "bold 16px sans-serif"; ctx.fillText("SCORE: " + Math.floor(score), 20, 40);
            } else {
                player.draw(); for (let o of obstacles) o.draw();
                ctx.fillStyle = "rgba(0,0,0,0.85)"; ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = "#ff6b6b"; ctx.font = "bold 38px sans-serif"; ctx.textAlign = "center"; ctx.fillText("GAME OVER", 200, 300);
                ctx.fillStyle = "#ffffff"; ctx.font = "16px sans-serif"; ctx.fillText("Final Score: " + Math.floor(score), 200, 350);
                ctx.fillStyle = "#a4b0be"; ctx.font = "13px sans-serif"; ctx.fillText("TAP SCREEN TO RESTART", 200, 420);
            }
            requestAnimationFrame(loop);
        }
    }

    // Force network fetch immediately
    loadFreshGame();
</script>

</body>
</html>
