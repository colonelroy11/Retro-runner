<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- Viewport configurations optimized for responsive screen scaling -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Retro Endless Runner - Universal Mobile Rebuild</title>
    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        
        body {
            margin: 0;
            padding: 0;
            background-color: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            user-select: none;
            touch-action: none;
        }

        #gameContainer {
            position: relative;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            border-radius: 8px;
            overflow: hidden;
            width: 100%;
            max-width: 800px;
            aspect-ratio: 2 / 1;
        }

        canvas {
            background-color: #2c3e50;
            display: block;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>

<div id="gameContainer">
    <!-- Fixed internal reference sizes for consistent engine hitboxes across display formats -->
    <canvas id="gameCanvas" width="800" height="400"></canvas>
</div>

<script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    // ==========================================
    // EXTENSIVE STATE TRACKING MATRIX
    // ==========================================
    let gameState = "MENU"; 
    let selectedDifficulty = 1; 
    let score = 0;
    let gameSpeed = 5;
    let maxSpeedSetting = 15;
    let speedIncrementSetting = 0.001;

    const GROUND_Y = canvas.height - 60;
    const GRAVITY = 0.6;

    let scorePopups = [];
    let particles = [];

    // ==========================================
    // ANTI-CRASH STORAGE MEMORY PROTECTION
    // ==========================================
    let highScore = 0;
    let totalCoins = 0;

    try {
        if (typeof localStorage !== 'undefined' && localStorage !== null) {
            if (localStorage.getItem("runner_highscore")) {
                highScore = parseFloat(localStorage.getItem("runner_highscore"));
            }
            if (localStorage.getItem("runner_coinbank")) {
                totalCoins = parseInt(localStorage.getItem("runner_coinbank"));
            }
        }
    } catch (e) {
        console.log("Storage access restricted. Safe-mode active.");
    }

    function saveData(key, value) {
        try {
            if (typeof localStorage !== 'undefined' && localStorage !== null) {
                localStorage.setItem(key, value);
            }
        } catch (e) {}
    }

    // ==========================================
    // AUDIO FREQUENCY GENERATOR
    // ==========================================
    let audioCtx = null;

    function initAudio() {
        if (!audioCtx) {
            try {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            } catch (e) {}
        }
    }

    function playSound(type) {
        if (!audioCtx) return;
        try {
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }

            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            const now = audioCtx.currentTime;

            if (type === "JUMP") {
                osc.type = "triangle";
                osc.frequency.setValueAtTime(150, now);
                osc.frequency.exponentialRampToValueAtTime(400, now + 0.12);
                gainNode.gain.setValueAtTime(0.15, now);
                gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.12);
                osc.start(now); osc.stop(now + 0.12);
            } 
            else if (type === "COIN") {
                osc.type = "sine";
                osc.frequency.setValueAtTime(587.33, now); 
                osc.frequency.setValueAtTime(880, now + 0.06);   
                gainNode.gain.setValueAtTime(0.15, now);
                gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
                osc.start(now); osc.stop(now + 0.2);
            } 
            else if (type === "ITEM") {
                osc.type = "sine";
                osc.frequency.setValueAtTime(523.25, now); 
                osc.frequency.setValueAtTime(659.25, now + 0.05); 
                osc.frequency.setValueAtTime(783.99, now + 0.1); 
                osc.frequency.setValueAtTime(1046.50, now + 0.15); 
                gainNode.gain.setValueAtTime(0.15, now);
                gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                osc.start(now); osc.stop(now + 0.3);
            } 
            else if (type === "HIT") {
                osc.type = "sawtooth";
                osc.frequency.setValueAtTime(120, now);
                osc.frequency.linearRampToValueAtTime(40, now + 0.4);
                gainNode.gain.setValueAtTime(0.3, now);
                gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
                osc.start(now); osc.stop(now + 0.4);
            }
            else if (type === "SELECT") {
                osc.type = "square";
                osc.frequency.setValueAtTime(300, now);
                gainNode.gain.setValueAtTime(0.08, now);
                gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.05);
                osc.start(now); osc.stop(now + 0.05);
            }
        } catch(err) {}
    }

    // ==========================================
    // GRAPHIC SAFE ASSET MANAGERS
    // ==========================================
    let heroLoaded = false, obstacleLoaded = false, coinLoaded = false, itemLoaded = false;

    const imgPlayer = new Image();
    imgPlayer.onload = () => { heroLoaded = true; };
    imgPlayer.src = "./hero.png"; 

    const imgObstacle = new Image();
    imgObstacle.onload = () => { obstacleLoaded = true; };
    imgObstacle.src = "./obstacle.png";       

    const imgCoin = new Image();
    imgCoin.onload = () => { coinLoaded = true; };
    imgCoin.src = "./coin.png";   

    const imgItem = new Image();
    imgItem.onload = () => { itemLoaded = true; };
    imgItem.src = "./item.png";

    // ==========================================
    // ENTITY ATTRIBUTE SETS
    // ==========================================
    const player = {
        x: 80,
        y: GROUND_Y - 60,
        width: 50,  
        height: 60,
        velocityY: 0,
        jumpForce: -13,
        isGrounded: false,
        jumpCount: 0,
        maxJumps: 2,

        update() {
            this.velocityY += GRAVITY;
            this.y += this.velocityY;

            if (this.y + this.height >= GROUND_Y) {
                this.y = GROUND_Y - this.height;
                this.velocityY = 0;
                this.isGrounded = true;
                this.jumpCount = 0;
            } else {
                this.isGrounded = false;
            }
        },

        draw() {
            if (heroLoaded && imgPlayer.complete && imgPlayer.naturalWidth > 0) {
                ctx.drawImage(imgPlayer, this.x, this.y, this.width, this.height);
            } else {
                ctx.fillStyle = "#00d2d3"; 
                ctx.fillRect(this.x, this.y, this.width, this.height);
            }
        },

        reset() {
            this.y = GROUND_Y - this.height;
            this.velocityY = 0;
            this.isGrounded = true;
            this.jumpCount = 0;
        }
    };

    let obstacles = [];
    let spawnTimer = 0, minSpawnInterval = 70, maxSpawnInterval = 160; 

    class Obstacle {
        constructor() {
            this.width = 30 + Math.random() * 25;  
            this.height = 35 + Math.random() * 30; 
            this.x = canvas.width + 20;            
            this.y = GROUND_Y - this.height;
        }
        update() { this.x -= gameSpeed; }
        draw() {
            if (obstacleLoaded && imgObstacle.complete && imgObstacle.naturalWidth > 0) {
                ctx.drawImage(imgObstacle, this.x, this.y, this.width, this.height);
            } else {
                ctx.fillStyle = "#ff6b6b"; 
                ctx.fillRect(this.x, this.y, this.width, this.height);
            }
        }
    }

    let collectibles = [];
    let collectibleSpawnTimer = 100;

    class Collectible {
        constructor(type) {
            this.type = type; 
            this.width = 30; this.height = 30;
            this.x = canvas.width + 20;
            this.y = GROUND_Y - this.height - (Math.random() > 0.5 ? 0 : 70); 
        }
        update() { this.x -= gameSpeed; }
        draw() {
            if (this.type === "COIN") {
                if (coinLoaded && imgCoin.complete && imgCoin.naturalWidth > 0) {
                    ctx.drawImage(imgCoin, this.x, this.y, this.width, this.height);
                } else {
                    ctx.fillStyle = "#f1c40f"; ctx.beginPath(); ctx.arc(this.x + 15, this.y + 15, 15, 0, Math.PI*2); ctx.fill();
                }
            } else {
                if (itemLoaded && imgItem.complete && imgItem.naturalWidth > 0) {
                    ctx.drawImage(imgItem, this.x, this.y, this.width, this.height);
                } else {
                    ctx.fillStyle = "#9b59b6"; ctx.beginPath(); ctx.arc(this.x + 15, this.y + 15, 15, 0, Math.PI*2); ctx.fill();
                }
            }
        }
    }

    class Particle {
        constructor(x, y, color) {
            this.x = x; this.y = y; this.color = color;
            this.radius = 2 + Math.random() * 3;
