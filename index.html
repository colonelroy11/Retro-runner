<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Retro Runner - Complete Robust Build</title>
    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        
        body {
            margin: 0;
            padding: 0;
            background-color: #111416;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #ffffff;
            font-family: 'Segoe UI', Arial, sans-serif;
            overflow: hidden;
            user-select: none;
            touch-action: none;
        }

        #diagnosticBanner {
            background-color: #2ecc71;
            color: #111416;
            padding: 8px 16px;
            font-weight: bold;
            border-radius: 4px;
            margin-bottom: 15px;
            font-size: 14px;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            z-index: 20;
        }

        #gameContainer {
            position: relative;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
            border: 2px solid #00d2d3;
            border-radius: 8px;
            overflow: hidden;
            width: 95vw;
            height: 80vh; 
            max-width: 800px;
            max-height: 400px;
            background-color: #1e272e;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* Robust HTML Menu Layer stacked directly over the Canvas */
        #menuLayer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(17, 20, 22, 0.95);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 5;
            padding: 20px;
        }

        #menuTitle {
            color: #00d2d3;
            font-size: clamp(28px, 6vw, 42px);
            font-weight: bold;
            margin: 0 0 10px 0;
            text-shadow: 0 0 10px rgba(0,210,211,0.3);
        }

        #menuStats {
            color: #f1c40f;
            font-size: clamp(13px, 3.5vw, 16px);
            margin-bottom: 25px;
        }

        #menuPrompt {
            font-size: clamp(14px, 4vw, 18px);
            margin-bottom: 15px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .buttonGroup {
            display: flex;
            gap: 15px;
        }

        .diffButton {
            background: transparent;
            border: 2px solid #00d2d3;
            color: #ffffff;
            padding: 10px 24px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .diffButton:active {
            background-color: #00d2d3;
            color: #111416;
            transform: scale(0.95);
        }
    </style>
</head>
<body>

<div id="diagnosticBanner">✅ SYSTEM INITIALIZATION: WEB UI LAYER DEPLOYED (BUILD 8.0)</div>

<div id="gameContainer">
    <!-- Guaranteed HTML UI Core Layer -->
    <div id="menuLayer">
        <h1 id="menuTitle">RETRO RUNNER</h1>
        <div id="menuStats">🏆 Record: <span id="hiScoreVal">0</span> | 💰 Coins: <span id="coinVal">0</span></div>
        <div id="menuPrompt">CHOOSE DIFFICULTY TO START</div>
        <div class="buttonGroup">
            <button class="diffButton" onclick="startGame(0)">EASY</button>
            <button class="diffButton" onclick="startGame(1)">MEDIUM</button>
            <button class="diffButton" onclick="startGame(2)">HARD</button>
        </div>
    </div>
    
    <canvas id="gameCanvas" width="800" height="400"></canvas>
</div>

<script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    const menuLayer = document.getElementById("menuLayer");

    let gameState = "MENU"; 
    let score = 0;
    let gameSpeed = 5;
    let maxSpeedSetting = 15;
    let speedIncrementSetting = 0.001;

    const GROUND_Y = canvas.height - 60;
    const GRAVITY = 0.6;

    let scorePopups = [];
    let particles = [];
    let obstacles = [];
    let collectibles = [];
    let spawnTimer = 0;
    let collectibleSpawnTimer = 100;
    let minSpawnInterval = 70;
    let maxSpawnInterval = 160;

    let highScore = 0;
    let totalCoins = 0;

    // Load highscore records securely from local storage
    try {
        if (typeof localStorage !== 'undefined' && localStorage !== null) {
            if (localStorage.getItem("runner_highscore")) highScore = parseFloat(localStorage.getItem("runner_highscore"));
            if (localStorage.getItem("runner_coinbank")) totalCoins = parseInt(localStorage.getItem("runner_coinbank"));
        }
    } catch (e) {}

    // Update the HTML dashboard statistics labels directly
    document.getElementById("hiScoreVal").innerText = Math.floor(highScore);
    document.getElementById("coinVal").innerText = totalCoins;

    const player = {
        x: 80,
        y: GROUND_Y - 50,
        width: 40,
        height: 50,
        velocityY: 0,
        jumpForce: -12.5,
        isGrounded: false,
        jumpCount: 0,
        maxJumps: 2,

        update() {
            this.velocityY += GRAVITY;
            this.y += this.velocityY;
            if (this.y + this.height >= GROUND_Y) {
                this.y = GROUND_Y - this.height;
                this.velocityY = 0;
                this.isGrounded = true;
                this.jumpCount = 0;
            } else {
                this.isGrounded = false;
            }
        },

        draw() {
            ctx.fillStyle = "#00d2d3";
            ctx.fillRect(this.x, this.y, this.width, this.height);
            ctx.strokeStyle = "#ffffff";
            ctx.lineWidth = 2;
            ctx.strokeRect(this.x, this.y, this.width, this.height);
        }
    };

    class Obstacle {
        constructor() {
            this.width = 25 + Math.random() * 20;
            this.height = 30 + Math.random() * 25;
            this.x = canvas.width + 20;
            this.y = GROUND_Y - this.height;
        }
        update() { this.x -= gameSpeed; }
        draw() {
            ctx.fillStyle = "#ff6b6b";
            ctx.fillRect(this.x, this.y, this.width, this.height);
            ctx.strokeStyle = "#ffffff";
            ctx.lineWidth = 1.5;
            ctx.strokeRect(this.x, this.y, this.width, this.height);
        }
    }

    class Collectible {
        constructor(type) {
            this.type = type;
            this.width = 24;
            this.height = 24;
            this.x = canvas.width + 20;
            this.y = GROUND_Y - this.height - (Math.random() > 0.5 ? 10 : 75);
        }
        update() { this.x -= gameSpeed; }
        draw() {
            ctx.fillStyle = this.type === "COIN" ? "#f1c40f" : "#9b59b6";
            ctx.beginPath();
            ctx.arc(this.x + 12, this.y + 12, 12, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = "#ffffff";
            ctx.lineWidth = 1;
            ctx.stroke();
        }
    }

    class Particle {
        constructor(x, y, color) {
            this.x = x; this.y = y; this.color = color;
            this.radius = 2 + Math.random() * 2;
            this.vx = (Math.random() - 0.5) * 5;
            this.vy = (Math.random() - 0.7) * 5;
            this.alpha = 1;
            this.decay = 0.02 + Math.random() * 0.02;
        }
        update() { this.x += this.vx; this.y += this.vy; this.vy += 0.08; this.alpha -= this.decay; }
        draw() {
            ctx.save(); ctx.globalAlpha = this.alpha; ctx.fillStyle = this.color;
            ctx.beginPath(); ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2); ctx.fill(); ctx.restore();
        }
    }

    function createParticleBurst(x, y, color) {
        for (let i = 0; i < 10; i++) particles.push(new Particle(x, y, color));
    }

    function manageEntities() {
        spawnTimer--;
        let dynamicInterval = maxSpawnInterval - ((gameSpeed / maxSpeedSetting) * (maxSpawnInterval - minSpawnInterval));
        if (spawnTimer <= 0) {
            obstacles.push(new Obstacle());
            spawnTimer = dynamicInterval + (Math.random() * 50);
        }

        for (let i = obstacles.length - 1; i >= 0; i--) {
            obstacles[i].update(); obstacles[i].draw();
            if (player.x < obstacles[i].x + obstacles[i].width && player.x + player.width > obstacles[i].x && player.y < obstacles[i].y + obstacles[i].height && player.y + player.height > obstacles[i].y) {
                gameState = "GAMEOVER";
                createParticleBurst(player.x + player.width / 2, player.y + player.height / 2, "#ff6b6b");
                if (score > highScore) {
                    highScore = score;
                    try { localStorage.setItem("runner_highscore", highScore); } catch(e){}
                    document.getElementById("hiScoreVal").innerText = Math.floor(highScore);
                }
            }
            if (obstacles[i].x + obstacles[i].width < 0) obstacles.splice(i, 1);
        }

        collectibleSpawnTimer--;
        if (collectibleSpawnTimer <= 0) {
            collectibles.push(new Collectible(Math.random() > 0.25 ? "COIN" : "ITEM"));
            collectibleSpawnTimer = 110 + Math.random() * 90;
        }

        for (let i = collectibles.length - 1; i >= 0; i--) {
            collectibles[i].update(); collectibles[i].draw();
