<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Retro Cyber Runner - Cloud Host Build</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #04050a;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            color: #ffffff;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }

        #gameContainer {
            position: relative;
            width: 100%;
            max-width: 430px;
            height: 100%;
            max-height: 780px;
            box-shadow: 0 0 50px rgba(56, 189, 248, 0.5);
            aspect-ratio: 9 / 16;
            background-color: #060913;
            border: 2px solid #101726;
            border-radius: 14px;
            overflow: hidden;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>

<div id="gameContainer">
    <canvas id="gameCanvas"></canvas>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    function resizeCanvas() {
        const container = document.getElementById('gameContainer');
        canvas.width = container.clientWidth;
        canvas.height = container.clientHeight;
    }
    resizeCanvas();

    // ==========================================
    // WEB AUDIO SYNTHESIZERS (ZERO-FILE SOUNDS)
    // ==========================================
    const AudioEngine = {
        ctx: null,
        init() {
            if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)();
        },
        play(type) {
            this.init();
            if (!this.ctx) return;
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.connect(gain); gain.connect(this.ctx.destination);
            const now = this.ctx.currentTime;

            if (type === 'jump') {
                osc.type = 'square';
                osc.frequency.setValueAtTime(140, now);
                osc.frequency.exponentialRampToValueAtTime(420, now + 0.12);
                gain.gain.setValueAtTime(0.06, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
                osc.start(now); osc.stop(now + 0.12);
            } else if (type === 'coin') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(620, now);
                osc.frequency.setValueAtTime(930, now + 0.06);
                gain.gain.setValueAtTime(0.08, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.22);
                osc.start(now); osc.stop(now + 0.22);
            } else if (type === 'shield') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(250, now);
                osc.frequency.exponentialRampToValueAtTime(550, now + 0.25);
                gain.gain.setValueAtTime(0.08, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
                osc.start(now); osc.stop(now + 0.25);
            } else if (type === 'laser') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(800, now);
                osc.frequency.linearRampToValueAtTime(150, now + 0.15);
                gain.gain.setValueAtTime(0.05, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
                osc.start(now); osc.stop(now + 0.15);
            } else if (type === 'crash') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(100, now);
                osc.frequency.linearRampToValueAtTime(20, now + 0.4);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
                osc.start(now); osc.stop(now + 0.4);
            }
        }
    };

    // ==========================================
    // GAME CORE CONFIGURATIONS & STATE REGISTERS
    // ==========================================
    let currentMenu = 'DIFFICULTY'; 
    const difficultySettings = {
        EASY:   { speed: 3.5, accel: 0.0001, spawnMod: 1.3 },
        MEDIUM: { speed: 5.0, accel: 0.0003, spawnMod: 1.0 },
        HARD:   { speed: 7.0, accel: 0.0006, spawnMod: 0.72 }
    };
    let activeDiff = 'MEDIUM';

    let GRAVITY = 0.5;
    let gameSpeed = 5;
    let speedAccel = 0.0003;
    let score = 0;
    let animationFrameId = null;
    let lastObstacleTime = 0;
    let spawnDelay = 1500;

    let highScore = localStorage.getItem('cc_runner_hi') ? parseInt(localStorage.getItem('cc_runner_hi')) : 0;
    let totalCoins = localStorage.getItem('cc_total_coins') ? parseInt(localStorage.getItem('cc_total_coins')) : 0;
    let magnetLevel = localStorage.getItem('cc_shop_mag') ? parseInt(localStorage.getItem('cc_shop_mag')) : 1; 
    let jumpLevel = localStorage.getItem('cc_shop_jmp') ? parseInt(localStorage.getItem('cc_shop_jmp')) : 1; 

    let coinCombo = 0;
    let comboTimer = 0;
    const COMBO_DURATION = 120;

    let shieldActive = false;
    let shieldTimer = 0;
    let maxShieldDuration = 300 + (magnetLevel - 1) * 90; 

    let activeSkinIndex = 0;
    const customSkins = [
        { name: 'NEON SLIME', color: '#4ade80', trailColor: 'rgba(74, 222, 128,' },
        { name: 'CYBER VAPOR', color: '#22d3ee', trailColor: 'rgba(34, 211, 238,' }
    ];

    let player;
    let obstacles = [];
    let coins = [];
    let items = [];
    let particles = [];
    let lasers = [];
    let bossEnemy = null;
    let shareFeedbackTimer = 0;

    function getUpgradeCost(level) {
        if (level >= 5) return 'MAX';
        return level * 150; 
    }

    // ==========================================
    // CLOUD ASSET FILE MANAGER
    // ==========================================
    const sprites = { playerSheet: new Image(), obstacle: new Image(), coin: new Image(), item: new Image() };
    let assetsReady = { playerSheet: false, obstacle: false, coin: false, item: false };

    sprites.playerSheet.onload = () => { assetsReady.playerSheet = true; };
    sprites.obstacle.onload = () => { assetsReady.obstacle = true; };
    sprites.coin.onload = () => { assetsReady.coin = true; };
    sprites.item.onload = () => { assetsReady.item = true; };

    sprites.playerSheet.src = 'hero.png'; 
    sprites.obstacle.src = 'obstacle.png'; 
    sprites.coin.src = 'coin.png'; 
    sprites.item.src = 'item.png';

    // ==========================================
    // VISUAL EFFECT SYSTEMS
    // ==========================================
    class Particle {
        constructor(x, y, color) {
            this.x = x; this.y = y;
            this.vx = (Math.random() - 0.5) * 6;
            this.vy = (Math.random() - 0.5) * 6 - 2;
            this.radius = 2 + Math.random() * 3;
            this.color = color; this.alpha = 1;
            this.decay = 0.02 + Math.random() * 0.03;
        }
        update() { this.x += this.vx; this.y += this.vy; this.alpha -= this.decay; }
        draw() {
            ctx.save(); ctx.globalAlpha = this.alpha; ctx.fillStyle = this.color;
            ctx.beginPath(); ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2); ctx.fill(); ctx.restore();
        }
    }
    function createExplosion(x, y, color, count = 12) {
        for (let i = 0; i < count; i++) particles.push(new Particle(x, y, color));
    }

    class BackgroundSystem {
        constructor() { this.hue = 0; }
        update() {
            if (bossEnemy) { this.hue = 0; return; } 
            this.hue = (score * 0.15) % 360;
        }
        draw() {
            let gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
            if (bossEnemy) {
                gradient.addColorStop(0, '#1a0505'); gradient.addColorStop(1, '#080101');
            } else {
                gradient.addColorStop(0, `hsl(${this.hue}, 40%, 4%)`); gradient.addColorStop(1, `hsl(${(this.hue + 60) % 360}, 45%, 10%)`);
            }
            ctx.fillStyle = gradient; ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.strokeStyle = bossEnemy ? 'rgba(239, 68, 68, 0.05)' : `hsla(${this.hue}, 80%, 60%, 0.04)`;
            ctx.lineWidth = 1;
            for (let i = 0; i < canvas.width; i += 40) {
                ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, canvas.height); ctx.stroke();
            }
        }
    }
    const bgEngine = new BackgroundSystem();

    // ==========================================
    // ENTITIES & LOOPS
    // ==========================================
    class Player {
        constructor() {
            this.width = 44; this.height = 54; this.x = 40;
            this.groundY = canvas.height - this.height - 80; this.y = this.groundY;
            this.velocityY = 0;
            this.jumpForce = -12 - (jumpLevel - 1) * 0.5;
            this.jumpCount = 0; this.maxJumps = 2;
            this.frameIndex = 0; this.tickCount = 0; this.ticksPerFrame = 6; this.numberOfFrames = 4;
            this.trail = []; this.maxTrailSegments = 6;
        }
        jump() {
            if (this.jumpCount < this.maxJumps) {
                AudioEngine.play('jump');
                this.velocityY = this.jumpForce; this.jumpCount++;
                createExplosion(this.x + this.width / 2, this.y + this.height, customSkins[activeSkinIndex].color, 6);
            }
        }
        update() {
            this.velocityY += GRAVITY; this.y += this.velocityY;
            if (this.y >= this.groundY) { this.y = this.groundY; this.velocityY = 0; this.jumpCount = 0; }
